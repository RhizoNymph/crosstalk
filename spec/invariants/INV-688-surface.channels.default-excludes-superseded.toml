[invariant]
id = "surface.channels.default-excludes-superseded"
statement = "ChannelFilter::matches keeps a superseded channel only under OriginFilter::WithSuperseded or Superseded, keeps a channel in force only under InForce or WithSuperseded when its CanonicalOriginKind is listed or the list is empty, applies detections and policies to each channel's own record, and so under the default filter keeps every channel in force and no superseded one."
kind = "domain"
property = "postcondition"
requires = ["unit"]
rationale = """
A superseded channel resolves to another everywhere else in the surface, so
listing it by default would show one medium twice, once with the counts and
once without. Folding the superseded choice into the origin filter means a
request cannot ask for superseded channels while excluding them. Origins
apply to channels in force only: a superseded channel was always
discovered, and its own variant selects it.
"""

[evidence]
unit = [
    "crosstalk_spec::tests::channel_reads::the_default_filter_lists_every_channel_in_force_and_no_superseded_one",
    "crosstalk_spec::tests::channel_reads::origin_filter_selects_origins_in_force_and_superseded_channels_by_variant",
    "crosstalk_spec::tests::channel_reads::channel_filter_combines_origin_detection_and_policy",
]

[evidence-review]
unit = { agent = "true", human = "false" }
