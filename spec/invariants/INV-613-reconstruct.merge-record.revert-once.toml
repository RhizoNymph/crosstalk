[invariant]
id = "reconstruct.merge-record.revert-once"
statement = "MergeRecord::revert on a record already reverted returns InvalidReversal::AlreadyReverted and keeps the first reversal, and IdentityResolver::unmerge on such a record returns MergeAlreadyReverted and changes nothing."
kind = "domain"
property = "postcondition"
requires = ["unit", "integration"]
rationale = """
A record describes one merge; reverting it twice could restore agents that
later decisions moved, or record a second veto under another operator's
name. The surface reports the repeat as Conflict(MergeAlreadyReverted) so
the UI can say it was already undone.
"""

[evidence]
unit = [
    "crosstalk_spec::tests::agents::a_record_is_reverted_at_most_once",
    "crosstalk_spec::tests::agents::a_record_cannot_be_reverted_twice",
    "crosstalk_spec::tests::wire::observed::identity::merge_records_refuse_a_self_merge_and_a_second_reversal",
]
integration = "crosstalk_reconstruct::tests::pg_agents::pg_unmerge_twice_conflicts"

[evidence-review]
unit = { agent = "true", human = "false" }
integration = { agent = "true", human = "false" }
