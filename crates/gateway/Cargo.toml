[package]
name = "crosstalk-gateway"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "The crosstalk gateway: configuration, wiring and process roles behind the crosstalk binary."

[lints]
workspace = true

[dependencies]
blake3.workspace = true
crosstalk-spec = { path = "../../spec" }
crosstalk-api = { path = "../api" }
crosstalk-canonical = { path = "../canonical" }
crosstalk-flow = { path = "../flow" }
crosstalk-ingress = { path = "../ingress" }
crosstalk-memory = { path = "../memory" }
crosstalk-provenance = { path = "../provenance" }
crosstalk-reconstruct = { path = "../reconstruct" }
crosstalk-store = { path = "../store" }
crosstalk-surface = { path = "../surface" }
crosstalk-topology = { path = "../topology" }
crosstalk-transport = { path = "../transport" }
bytes.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["client", "http1", "server"] }
hyper-util = { workspace = true, features = ["tokio"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt", "json", "std"] }

[[bin]]
name = "crosstalk"
path = "src/main.rs"

[dev-dependencies]
crosstalk-sim = { path = "../sim" }
crosstalk-testkit = { path = "../testkit" }
tempfile.workspace = true
