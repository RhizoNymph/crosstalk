[invariant]
id = "surface.audit.outcome-round-trip"
statement = "AuditOutcome::of maps Ok(o) to Succeeded(o), Forbidden { missing } to Forbidden { missing }, NotFound, Conflict and InvalidInput to Rejected with the same variant and detail, and Store to Rejected(Failed) with the same reason, and AuditOutcome::result inverts it exactly."
kind = "domain"
property = "postcondition"
requires = ["unit"]
rationale = """
The entry must say exactly what the operator was told. Losing the detail
of a rejection, recording a no-op acknowledgement as Applied, or dropping
an id the outcome created (a rule, a promoted channel, a merge) would make
the log disagree with the response; Unchanged keeps the losing request of
a race from looking like a second transition.
"""

[evidence]
unit = [
    "crosstalk_spec::tests::audit::outcome_maps_every_result_and_back",
    "crosstalk_spec::tests::audit::outcome_keeps_rejection_detail",
    "crosstalk_spec::tests::audit::audit_outcome_inverts_every_act_result",
    "crosstalk_spec::tests::audit::every_action_error_keeps_its_variant_as_a_query_error",
    "crosstalk_spec::tests::audit::a_promotion_outcome_round_trips_through_the_audit_log",
]

[evidence-review]
unit = { agent = "true", human = "false" }
