[package]
name = "crosstalk-flow"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "L5 flow for crosstalk: resource extraction, the channel registry, the correlator and the verdict store."

[lints]
workspace = true

[dependencies]
crosstalk-spec = { path = "../../spec" }
blake3.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tracing.workspace = true

[dev-dependencies]
crosstalk-memory = { path = "../memory" }
crosstalk-sim = { path = "../sim" }
crosstalk-testkit = { path = "../testkit" }
crosstalk-transport = { path = "../transport" }
proptest.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "test-util", "time"] }
