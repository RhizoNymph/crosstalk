[invariant]
id = "surface.agent.watermark-read-first"
statement = "Every page of QueryApi::agents and every QueryApi::agent detail carries the watermark that EdgeStore::agent_traffic read before the buckets its counts were summed from."
kind = "coordination"
requires = ["dst"]
rationale = """
The counts come from the same buckets as topology, so a client needs the
same settled boundary to know they are final for a window ending before
it. Only the counts are settled by it; labels, states, aliases, claims and
last-seen times come from L3, so the watermark claims nothing about them.
"""

[evidence]
dst = "crosstalk::surface::dst::agent_reads_watermark_read_first"

[evidence-review]
dst = { agent = "false", human = "false" }
