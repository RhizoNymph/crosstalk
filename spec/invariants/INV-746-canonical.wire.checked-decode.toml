[invariant]
id = "canonical.wire.checked-decode"
statement = "Decoding JSON into a checked type runs its checked constructor, so JSON the constructor refuses is a decode error and never yields a value."
kind = "representation"
requires = ["type", "unit"]
rationale = """
A checked type's invariants (a window that is not empty, a page size in
1..=500, a non-empty list, a cursor token in the URL-safe alphabet, a page
with a next cursor holding items) hold only if every value goes through its
constructor. A derived Deserialize would build one from any JSON with the
right fields, so checked types deserialize through a private raw mirror and
TryFrom into the constructor (#[serde(try_from = ...)]), and decoding
accepts exactly what the constructor accepts, including its normalization
(NonBlank trims, IdBatch sorts and drops repeats).
"""

