[invariant]
id = "surface.excerpt.window"
statement = "Excerpt::cut of a part's text around a range returns the part's text from elided_before on, highlighting the range from its start (whole, or its longest prefix of at most Excerpt::MAX_HIGHLIGHT bytes that ends on a character boundary, the rest counted in highlight_cut), with the most context on each side that fits in the window without splitting a character (none after a cut highlight), and elided_before plus the text, highlight_cut and elided_after add up to the part's length."
kind = "domain"
property = "postcondition"
requires = ["unit", "property"]
rationale = """
This is what the window parameter means. Moving each edge inward to a
character boundary never shows more than the window asked for and never
splits a character; counting every byte not shown lets the page say how
much was elided on each side and that a long match was shortened.
"""

[evidence]
unit = [
    "crosstalk_spec::tests::excerpt::cut_shows_context_either_side_and_counts_the_rest",
    "crosstalk_spec::tests::excerpt::cut_stops_at_the_part_edges",
    "crosstalk_spec::tests::excerpt::zero_context_shows_only_the_match",
    "crosstalk_spec::tests::excerpt::context_edges_move_inward_to_character_boundaries",
    "crosstalk_spec::tests::excerpt::every_range_and_window_over_mixed_widths_is_well_cut",
    "crosstalk_spec::tests::excerpt::a_long_match_is_cut_on_a_boundary_with_no_context_after",
    "crosstalk_spec::tests::excerpt::a_match_exactly_at_the_bound_is_not_cut",
]
property = "crosstalk_surface::props::excerpt_cut_matches_part"

[evidence-review]
unit = { agent = "true", human = "false" }
property = { agent = "false", human = "false" }
