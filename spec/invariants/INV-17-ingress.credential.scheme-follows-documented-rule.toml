[invariant]
id = "ingress.credential.scheme-follows-documented-rule"
statement = "ClientIdentifier assigns credential schemes by the documented rule: x-api-key, and Bearer keys on a vendor API, are ApiKey; Bearer tokens on a subscription upstream are OAuthAccessToken; Copilot's minted tokens are ExchangedToken; the key of a self-hosted server is ServerKey."
kind = "domain"
property = "model-based"
requires = ["unit"]
rationale = """
The scheme decides how much a credential says about identity: an API key
is stable, OAuth and exchanged tokens rotate, a server key is shared by
every caller. A Bearer header looks the same for all four, so the rule
uses the header, the token's shape and the configured upstream kind. A
wrong scheme makes L3 merge strangers behind a shared server key or split
one agent across token refreshes.
"""

[evidence]
unit = "crosstalk_ingress::tests::credential::scheme_rule_per_harness_fixture"

[evidence-review]
unit = { agent = "true", human = "false" }
