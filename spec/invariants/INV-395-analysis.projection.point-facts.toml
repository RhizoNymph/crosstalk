[invariant]
id = "analysis.projection.point-facts"
statement = "Each ProjectedPoint carries AgentDirectory::canonical of its transmission's sender and reader at query time, the RouteKind of its route, its topic under the projection's topic version, and its Confirmed::at."
kind = "domain"
property = "postcondition"
requires = ["unit", "property"]
rationale = """
The client colours and links 50,000 points from these fields without a
lookup per point. A stale pre-merge agent id would colour one agent's
points in two colours and fail to link them to its graph node; a topic
from another version would colour by clusters the topic list no longer
shows.
"""

[evidence]
unit = "crosstalk::analysis::tests::projected_point_resolves_merged_agents"
property = "crosstalk::analysis::tests::prop_projected_points_match_transmissions"

[evidence-review]
unit = { agent = "false", human = "false" }
property = { agent = "false", human = "false" }
