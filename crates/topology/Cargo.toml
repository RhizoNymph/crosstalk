[package]
name = "crosstalk-topology"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "L7 topology for crosstalk: edge and access buckets, graphs, series, the watermark and retention."

[lints]
workspace = true

[dependencies]
crosstalk-spec = { path = "../../spec" }
crosstalk-store = { path = "../store" }
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
tracing.workspace = true

[dev-dependencies]
crosstalk-memory = { path = "../memory" }
crosstalk-transport = { path = "../transport" }
proptest.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "time", "macros", "test-util"] }
