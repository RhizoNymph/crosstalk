[invariant]
id = "canonical.ids.secret-never-serialized"
statement = "A DeploymentSecret, and a KeyedHasher holding one, implement neither Serialize, Deserialize nor Clone, and no Debug or Display text of either holds any part of the key."
kind = "confidentiality"
requires = ["type", "unit"]
rationale = """
The deployment secret keys every credential and account digest; anyone
holding it can confirm a guessed API key against stored evidence. Values
reach logs through Debug and Display and reach events, rows and blobs
through serde, so a secret type that implemented either would be one
careless format or field away from leaking. Without Clone the key exists
once per load. The type evidence is the two types, checked at compile time
by assert_not_impl (crate::wire::confidential); the unit test formats both,
alone and in a rotation, and finds neither the key's hex in either case
nor its bytes as a list.
"""

[evidence]
type = [
  "crosstalk_spec::ids::DeploymentSecret",
  "crosstalk_spec::ids::KeyedHasher",
]
unit = "crosstalk_spec::tests::secrets::secrets_never_show_their_key"

[evidence-review]
type = { agent = "true", human = "false" }
unit = { agent = "true", human = "false" }
