[invariant]
id = "surface.export.transmission-row-confirmed"
statement = "Every TransmissionRow without a state column holds a TransmissionSummary in the Confirmed, Classified or Aggregated state; a row whose summary is confirmed has that summary's delivery, and an unconfirmed row (only with a state column, INV-1069) has none."
kind = "representation"
requires = ["type", "unit"]
rationale = """
A default transmissions export is windowed and ordered by Confirmed::at
(RowKey::Transmission), so its rows must be confirmed; an export with
explicit states keys an unconfirmed row by its opening instead.
Holding the summary rather than copies of its fields keeps the row and
transmissions_by_id from drifting apart.
"""

[evidence]
type = "crosstalk_spec::interfaces::l8_surface::export::rows::TransmissionRow::new"
unit = [
    "crosstalk_spec::tests::export_stream::a_transmission_row_is_a_confirmed_summary",
    "crosstalk_spec::tests::export::transmission_rows_are_the_listed_summary_of_a_confirmed_transmission",
    "crosstalk_spec::tests::wire::surface_reads::export::export_rows_refuse_what_their_constructors_refuse",
]

[evidence-review]
type = { agent = "true", human = "false" }
unit = { agent = "true", human = "false" }
