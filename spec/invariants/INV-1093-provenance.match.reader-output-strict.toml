[invariant]
id = "provenance.match.reader-output-strict"
statement = "A ContentMatch with carrier ReaderOutput is made only for a relayed stretch that is one contiguous run of at least ReaderOutputRules::min_chars normalized characters (64 by default) holding a hit on its source; a stretch failing either rule stays Relayed from the span but yields no match, and matches with any other carrier keep no length floor."
kind = "domain"
property = "postcondition"
requires = ["unit", "property"]
rationale = """
Text a reader writes that another agent wrote, with no visible input
holding it, is the only evidence of a hidden channel, but in practice it is
mostly domain text both agents derive from the same task: SQL clauses,
shell idioms, stock phrases (false positives: SALT 1,029, open-swe 2,070,
lmcache 787). Per-world postings never reach the index cutoff of 50, so
the index cannot tell such text from a transmission. A reader-output match
therefore needs a long contiguous stretch. Neither a text-count cutoff nor
the spread rule may apply to it: when one agent broadcasts a distinctive
message through a channel the gateway cannot see and others copy it later,
every copy must still match the first writer, however many copies there
are, and a contiguous run of 64 characters or more is kept whatever its
spread (provenance.match.cross-agent-spread). Length alone does not make a
stretch distinctive, though: two agents filling one sentence template with
the same words write 64 characters or more alike, so by default the
stretch must also hold a token rare relative to its source's holders
(provenance.match.reader-output-rare-token), a bound every copy and read
raises, so broadcasts keep matching. The stretch is
still classified Relayed from the origin span, so it is never indexed as
the reader's (provenance.span.originated-absent-from-inputs); only the
match is withheld. Tool results, user turns and system prompts are visible
carriers whose reads are evidence on their own, and keep the index's rules.
"""

[evidence]
unit = ["crosstalk_provenance::tests::match_quality::short_reader_output_yields_no_match_but_tool_results_do", "crosstalk_provenance::tests::match_quality::shared_phrase_fragments_give_no_reader_output_match", "crosstalk_provenance::tests::match_quality::broadcast_copies_match_the_first_writer"]
property = "crosstalk_provenance::props::unexplained_output_text_matches_as_reader_output"

[evidence-review]
unit = { agent = "true", human = "false" }
property = { agent = "true", human = "false" }
