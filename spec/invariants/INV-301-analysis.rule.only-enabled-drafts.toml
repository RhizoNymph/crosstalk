[invariant]
id = "analysis.rule.only-enabled-drafts"
statement = "A rule that is disabled or stale, so that AlertRuleDef::evaluates is false, produces no AlertDraft for any envelope."
kind = "domain"
property = "postcondition"
requires = ["unit", "property"]
rationale = """
Disabling a rule is how an operator silences an alert class. A stale user
rule names topic ids from a superseded fit (TopicWatch::Stale) or a query
embedded with a model the embedder no longer uses (QueryWatch::Stale),
which no longer mean what the operator chose. A disabled rule that still
drafted would open alerts the operator turned off; a stale one would watch
the wrong topics or compare vectors from two models. Staleness is separate
from the operator's status, so a rule that went stale while enabled is
enabled and still drafts nothing.
"""

[evidence]
unit = ["crosstalk_analysis::tests::disabled_rule_drafts_nothing_on_its_trigger", "crosstalk_analysis::tests::stale_rule_drafts_nothing_on_its_trigger"]
property = "crosstalk_analysis::tests::non_enabled_rule_never_drafts"

[evidence-review]
unit = { agent = "false", human = "false" }
property = { agent = "false", human = "false" }
