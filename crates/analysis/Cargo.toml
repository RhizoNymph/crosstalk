[package]
name = "crosstalk-analysis"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "L6 analysis for crosstalk: embeddings, topics, search, alert rules and triage, and projections."

[lints]
workspace = true

[dependencies]
crosstalk-spec = { path = "../../spec" }
crosstalk-store = { path = "../store" }
blake3.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time"] }
tracing.workspace = true

[dev-dependencies]
crosstalk-memory = { path = "../memory" }
crosstalk-transport = { path = "../transport" }
proptest.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync", "time", "test-util"] }
