[invariant]
id = "ingress.credential.absent-from-raw-exchange"
statement = "No RawExchange contains a raw credential or raw account id; its ClientContext carries them only as CredentialHash and AccountHash."
kind = "confidentiality"
requires = ["type", "unit"]
rationale = """
RawExchange is the only value that leaves the hot path, and it reaches the
blob store, the bus and every downstream consumer. Credentials are bearer
secrets, and OAuth access tokens spend a user's subscription. RawExchange
carries no request head, so headers and query strings cannot ride along,
and ClientContext holds only keyed digests.
"""

[evidence]
type = ["crosstalk_spec::interfaces::l0_ingress::RawExchange", "crosstalk_spec::observed::client::ClientContext", "crosstalk_spec::observed::client::CredentialRef"]
unit = "crosstalk_ingress::tests::credential::raw_credential_absent_from_raw_exchange_per_scheme"

[evidence-review]
type = { agent = "true", human = "false" }
unit = { agent = "true", human = "false" }
