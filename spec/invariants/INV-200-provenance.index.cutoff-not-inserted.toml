[invariant]
id = "provenance.index.cutoff-not-inserted"
statement = "FingerprintIndex::insert stores no entry for a fingerprint whose frequency is above the cutoff."
kind = "domain"
property = "postcondition"
requires = ["unit", "integration"]
rationale = """
Frequent fingerprints are boilerplate (license headers, JSON keys, common
phrases). Storing a posting for every span that contains them grows those
posting lists without bound and contributes nothing to detection.
"""

[evidence]
unit = "crosstalk::provenance::tests::insert_skips_fingerprints_above_cutoff"
integration = "crosstalk::provenance::integration::pg_insert_skips_fingerprints_above_cutoff"

[evidence-review]
unit = { agent = "false", human = "false" }
integration = { agent = "false", human = "false" }
