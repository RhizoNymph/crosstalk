[invariant]
id = "reconstruct.agent-label.log-ordered"
statement = "The changes in every LabelLog are in non-decreasing time order."
kind = "representation"
requires = ["type", "unit"]
rationale = """
The current label is the last change. A change recorded out of order, such
as a delayed retry, would make an older label current again. `LabelLog` has
a private list and `LabelLog::record` rejects a change earlier than the
last one with `OutOfOrder`.
"""

[evidence]
type = "crosstalk_spec::observed::agent::LabelLog::record"
unit = [
    "crosstalk_spec::tests::agents::label_log_rejects_changes_out_of_order",
    "crosstalk_spec::tests::agents::label_log_current_follows_the_last_change",
]

[evidence-review]
type = { agent = "true", human = "false" }
unit = { agent = "true", human = "false" }
