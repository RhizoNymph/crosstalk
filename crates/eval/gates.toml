# ---------------------------------------------------------------------------
# Demo swarm benchmark (`ct-eval swarm`, detector `gateway-export`). A run
# scores under `demo-swarm/<scenario>`, the truth header's `scenario`
# (missing: headline).
#
# Calibrated on the clean node0 runs of 2026-10-06 (staging 8090af0, unique
# sessions per run; docs/features/eval.md "Swarm benchmark"):
#
# Headline 20261006T020835Z: 254 exchanges, recall 1.000 (55 / 55), precision
# 1.000 (0 false), channel / tool_result / exact 54 / 54. Gates sit a little
# below; rereads must not be reported at all.

[[gate]]
name = "demo-swarm/headline: every wiki transmission is found"
detector = "gateway-export"
dataset = "demo-swarm/headline"
metric = "recall"
min = 0.95

[[gate]]
name = "demo-swarm/headline: detections are transmissions"
detector = "gateway-export"
dataset = "demo-swarm/headline"
metric = "precision"
min = 0.95

[[gate]]
name = "demo-swarm/headline: wiki pages read through tool results are found"
detector = "gateway-export"
dataset = "demo-swarm/headline"
route = "channel"
carrier = "tool_result"
class = "exact"
metric = "recall"
min = 0.95

[[gate]]
name = "demo-swarm/headline: exact matches in wiki tool results are deliveries"
detector = "gateway-export"
dataset = "demo-swarm/headline"
route = "channel"
carrier = "tool_result"
class = "exact"
metric = "precision"
min = 0.95

[[gate]]
name = "demo-swarm/headline: no reread is reported as a transmission"
detector = "gateway-export"
dataset = "demo-swarm/headline"
metric = "violations"
reason = "reread"
max = 0

# Boilerplate 20261006T021639Z: agents write template-heavy text, so this
# bench measures the false-positive rate on boilerplate. 247 exchanges, recall
# 1.000 (50 / 50), precision 0.883, 22 false positives = 89.1 per 1k (15
# unobserved/reader_output template sentences, accepted with
# reader_output.min_chars = 64; 7 channel/exact). One false positive moves the
# rate by about 4 per 1k and Poisson noise on 22 is about ±19 per 1k, so the
# ceiling sits about two standard deviations above the measured rate.

[[gate]]
name = "demo-swarm/boilerplate: false positives per 1k exchanges stay bounded"
detector = "gateway-export"
dataset = "demo-swarm/boilerplate"
metric = "fp_per_1k"
max = 130.0

[[gate]]
name = "demo-swarm/boilerplate: every wiki transmission is still found"
detector = "gateway-export"
dataset = "demo-swarm/boilerplate"
metric = "recall"
min = 0.95

[[gate]]
name = "demo-swarm/boilerplate: template text does not swamp detections"
detector = "gateway-export"
dataset = "demo-swarm/boilerplate"
metric = "precision"
min = 0.80
