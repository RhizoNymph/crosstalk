[invariant]
id = "ingress.credential.hash-depends-only-on-credential"
statement = "For a given SecretVersion, changing anything about a request except its raw credential (proxy node, adapter, the header or query parameter carrying it, its scheme, time) leaves its CredentialHash unchanged."
kind = "domain"
property = "metamorphic"
requires = ["property"]
rationale = """
A credential hash is the strongest identity scope L3 has. If it varied by
node or by how the key was presented (x-api-key versus Authorization:
Bearer), one caller would split into several. Every node loads the same
secret versions, so the only legitimate change is a secret rotation, which
records a different SecretVersion.
"""

[evidence]
property = "crosstalk::ingress::tests::credential::hash_stable_under_request_changes"

[evidence-review]
property = { agent = "false", human = "false" }
