[invariant]
id = "analysis.triage.dedup-iff-active"
statement = "Triage returns Deduplicated exactly when an Open or Acknowledged alert with the draft's rule and subject exists, and Opened otherwise."
kind = "domain"
property = "postcondition"
requires = ["unit", "property"]
rationale = """
Acknowledged means an operator is working on it, so a repeat of the same
condition belongs to that alert rather than a fresh page. Resolved and
Suppressed alerts are closed: a recurrence after them is news and opens a
new alert.
"""

[evidence]
unit = ["crosstalk::analysis::tests::draft_folds_into_open_alert", "crosstalk::analysis::tests::draft_folds_into_acknowledged_alert", "crosstalk::analysis::tests::draft_after_resolved_opens_new_alert", "crosstalk::analysis::tests::draft_after_suppressed_opens_new_alert"]
property = "crosstalk::analysis::tests::triage_outcome_matches_active_alert_model"

[evidence-review]
unit = { agent = "false", human = "false" }
property = { agent = "false", human = "false" }
