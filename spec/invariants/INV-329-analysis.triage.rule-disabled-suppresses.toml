[invariant]
id = "analysis.triage.rule-disabled-suppresses"
statement = "AlertTriage::rule_disabled moves exactly the Open or Acknowledged alerts raised by that rule to Suppressed with reason RuleDisabled."
kind = "domain"
property = "postcondition"
requires = ["unit", "property"]
rationale = """
An operator disabling a rule has decided its condition is not
alert-worthy, so leaving its active alerts open would keep paging about
it. Alerts from other rules on the same subject are unaffected, and
resolved alerts keep their resolution.
"""

[evidence]
unit = ["crosstalk_analysis::alerts::tests::triage::rule_disabled_suppresses_its_active_alerts", "crosstalk_analysis::alerts::tests::triage::rule_disabled_leaves_other_rules_and_resolved_alerts"]
property = "crosstalk_analysis::alerts::tests::model::triage_matches_the_reference"

[evidence-review]
unit = { agent = "false", human = "false" }
property = { agent = "true", human = "false" }
