[invariant]
id = "provenance.match.cross-agent-spread"
statement = "A fingerprint or short-span hash is boilerplate for short runs when at least SpreadRule::agents distinct agents (4 by default) originated or copied it, at any time within retention, counting indexed spans, the spans relayed from them, the spans recorded as coinciding with them (provenance.span.coincident-template-originated), and, for a hit on a coinciding span, one hop of the spans it coincides with and their copies (sources of sources are not followed), and none of the whole tokens its k-gram covers in the read (normalized alphanumeric runs of 4 or more characters, or holding a digit) has been observed in at most SpreadRule::rare_bound(holders) texts (distinctive_ratio x holders + 1, ratio 2 by default; holders being the hit spans' own originations and copies, a coinciding span's sources not among them). Boilerplate fingerprints support no ContentMatch of any carrier none of whose contiguous runs holds SpreadRule::distinctive_chars normalized characters (64 by default); a match with such a contiguous run is kept whatever the spread."
kind = "domain"
property = "postcondition"
requires = ["unit"]
rationale = """
The boilerplate cutoff counts texts (50 by default), and a world of a few
agents never reaches it: on the node0 bench (20 agents) templated prompts,
short shared phrase fragments and generator-wide page skeletons matched
readers as deliveries. A template's pieces are written by many agents over
minutes, so no time window catches them, and without an observed read an
unobserved broadcast looks the same as a template: one earliest writer,
later holders. What separates them is distinctiveness. A short secret
passed around ("rendezvous key 7f3a, node 12, 03:00") holds a token seen
almost nowhere but in the secret's own copies; template prose is made of
words seen throughout the world. So a widespread short fragment is
boilerplate only when none of its whole tokens is rare relative to its
holders: a token in at most two texts per holder (the holder's writing and
one read of it) plus one is distinctive. Long runs (64 characters or more)
are kept whatever the spread: a broadcast or copy of that length is
evidence on its own. (A ReaderOutput stretch, having no observed read, must
also hold a rare token: provenance.match.reader-output-rare-token. A short
fragment held by fewer agents than the rule needs is still dropped when its
origin was given every token of it: provenance.match.inherited-fragment-dropped.)

The tradeoff: a template that carries a token seen nowhere else (a unique
header such as "ROUTINE-NOTES-v2") reads as distinctive and is matched
like a broadcast; so is a template whose words occur only inside the
template itself. Distinctiveness is relative to the world, so a world with
little other text makes most words rare. Token observations share the
index's retention, and each text observes at most
SpreadRule::tokens_per_text distinct tokens (512 by default); a capped
text undercounts, which makes tokens look rarer and keeps matches rather
than hiding them.
"""

[evidence]
unit = ["crosstalk_provenance::tests::match_quality::short_distinctive_broadcast_matches_the_first_writer", "crosstalk_provenance::tests::match_quality::template_with_a_unique_header_token_is_matched", "crosstalk_provenance::tests::match_quality::short_template_written_by_many_agents_is_not_matched", "crosstalk_provenance::tests::match_quality::short_template_fragments_from_unrelated_agents_give_no_match", "crosstalk_provenance::tests::match_quality::broadcast_copies_match_the_first_writer", "crosstalk_provenance::tests::match_quality::long_run_inside_a_template_still_matches", "crosstalk_provenance::tests::short::tokens_are_long_words_and_anything_with_digits"]

[evidence-review]
unit = { agent = "true", human = "false" }
