[invariant]
id = "analysis.projection.frame-layout"
statement = "ProjectionFrame::encode writes format 2: the 80-byte header (the channels table length C at offset 64, then 12 zero bytes) and the body sections at the offsets and in the order documented in projection/frame.rs (the channels table after the topics table, the channel index column after the topic index column), little-endian, zero-padded to a multiple of 8 bytes, for a total of 80 + 16 (S + R + T + C) + 52 n + K bytes before padding."
kind = "domain"
property = "postcondition"
requires = ["unit"]
rationale = """
The browser reads the frame by offset into typed arrays, with no parser, so
the layout is the contract between the server and the UI. Every section is
aligned for its element type, which a typed-array view requires. Format 2
added the channels table and channel column so points can be coloured by
channel from the frame alone; the header grew to 80 bytes to hold C and
keep every u128 section on a 16-byte boundary, and the format number
changed so a format-1 reader refuses it rather than misreading it.
"""

[evidence]
unit = ["crosstalk_spec::tests::projection_frame::encoded_length_follows_the_layout", "crosstalk_spec::tests::projection_frame::header_fields_sit_at_their_offsets", "crosstalk_spec::tests::projection_frame::body_sections_sit_at_their_offsets", "crosstalk_spec::tests::projection_frame::empty_frame_when_nothing_matched"]

[evidence-review]
unit = { agent = "true", human = "false" }
