[invariant]
id = "surface.audit.outcome-matches-permission"
statement = "An AuditRecord's outcome is Forbidden exactly when its Caller lacks its action's required permission."
kind = "representation"
requires = ["type", "unit"]
rationale = """
The permission is checked before any effect, so a forbidden caller cannot
have an action applied, rejected or found unchanged, and a permitted
caller cannot be forbidden. A record claiming otherwise would mislead
whoever investigates an incident from the log.
"""

[evidence]
type = "crosstalk_spec::interfaces::l8_surface::audit::AuditRecord::new"
unit = ["crosstalk_spec::tests::audit::forbidden_record_requires_missing_permission", "crosstalk_spec::tests::audit::attempted_record_requires_permission", "crosstalk_spec::tests::audit::every_action_reports_its_kind_and_permission"]

[evidence-review]
type = { agent = "true", human = "false" }
unit = { agent = "true", human = "false" }
