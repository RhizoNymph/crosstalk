[invariant]
id = "surface.query.transmissions-by-id-cross-agent"
statement = "QueryApi::transmissions_by_id lists, for each id of its selection, exactly TransmissionSummary::listed of the stored transmission under the aliases it reads: a transmission whose sender and reader resolve to one agent (Crossing::WithinOneAgent) is left out, a Detected one is listed, and an unmerge lists it again."
kind = "domain"
property = "postcondition"
requires = ["unit", "property"]
rationale = """
A lasso or a search's hits can name a transmission whose agents have
since been merged; every other view and every export (TransmissionRow::new)
leaves such a transmission out, so the rows behind a selection must too,
or a count and its list would disagree.
"""

[evidence]
unit = "crosstalk_spec::tests::confirmation::transmissions_by_id_omits_transmissions_within_one_agent"
property = "crosstalk_surface::tests::props::listing::prop_transmissions_by_id_skip_merged_pairs"

[evidence-review]
unit = { agent = "true", human = "false" }
property = { agent = "true", human = "false" }
