[invariant]
id = "surface.audit.outcome-round-trip"
statement = "AuditOutcome::of maps Ok(Applied) to Applied, Ok(Unchanged) to Unchanged, Forbidden to Forbidden, NotFound to Rejected(NotFound), and BadRequest and Store to Rejected Invalid and Failed with the same reason, and AuditOutcome::result inverts it."
kind = "domain"
property = "postcondition"
requires = ["unit"]
rationale = """
The record must say exactly what the operator was told. Losing the reason
of a rejection, or recording a no-op acknowledgement as Applied, would
make the log disagree with the response; Unchanged keeps the losing
request of a race from looking like a second transition.
"""

[evidence]
unit = ["crosstalk_spec::tests::audit::outcome_maps_every_result_and_back", "crosstalk_spec::tests::audit::outcome_keeps_rejection_reason"]

[evidence-review]
unit = { agent = "true", human = "false" }
