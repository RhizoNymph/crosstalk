[dependencies]
crosstalk-spec = { path = "../../spec" }
crosstalk-store = { path = "../store" }
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tracing.workspace = true
unicode-normalization.workspace = true

[dev-dependencies]
crosstalk-memory = { path = "../memory" }
crosstalk-sim = { path = "../sim" }
crosstalk-testkit = { path = "../testkit" }
crosstalk-transport = { path = "../transport" }
