[invariant]
id = "reconstruct.delta.names-outcome-conversation"
statement = "Every ThreadOutcome's delta names the outcome's conversation, never a Fork's parent or a Compaction's predecessor."
kind = "domain"
property = "invariant"
requires = ["property"]
rationale = """
ThreadOutcome carries the conversation both as a field and inside its delta,
so the types allow them to disagree. A fork's delta filed under the parent
would append fork messages to the parent's history as seen downstream.
"""

[evidence]
property = "crosstalk::reconstruct::tests::delta_names_outcome_conversation"

[evidence-review]
property = { agent = "false", human = "false" }
