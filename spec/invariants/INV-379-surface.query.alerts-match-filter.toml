[invariant]
id = "surface.query.alerts-match-filter"
statement = "QueryApi::alerts returns exactly the stored alerts whose state kind is in the filter's states (any state when the list is empty) and, when the filter names a channel, whose subject is that channel or a transmission routed through it."
kind = "domain"
property = "postcondition"
requires = ["unit", "property"]
rationale = """
The alert inbox is how operators find work. Dropping a matching alert hides
something that needs triage, and an alert from another channel in a
channel's view misleads the reviewer deciding that channel's policy. The
channel filter includes transmission alerts on that channel, as AlertFilter
documents, because sanctioning a channel leaves them active, so the channel
view is where they get reviewed.
"""

[evidence]
unit = "crosstalk::surface::tests::alert_filter_cases"
property = "crosstalk::surface::tests::prop_alerts_match_filter_model"

[evidence-review]
unit = { agent = "false", human = "false" }
property = { agent = "false", human = "false" }
