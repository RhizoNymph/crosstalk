[package]
name = "crosstalk-fixture"
version = "0.1.0"
edition = "2024"
publish = false
description = "A deterministic synthetic implementation of crosstalk's L8 traits, for the UI, tests and demos."

[features]
# Test handles (the fixed-clock constructor, scenario ids, feed and export
# knobs) and the conformance harness, for other crates' tests. Never
# enabled in a normal build.
testing = ["dep:crosstalk-conformance"]

[dependencies]
crosstalk-conformance = { path = "../conformance", optional = true }
crosstalk-spec = { path = "../spec" }
thiserror = "=2.0.21"
tokio = { version = "=1.53.1", features = ["rt", "sync", "time", "macros"] }
tracing = "=0.1.44"

[dev-dependencies]
crosstalk-conformance = { path = "../conformance" }
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "test-util"] }
