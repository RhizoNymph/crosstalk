[invariant]
id = "provenance.fingerprint.shard-is-modulo"
statement = "Fingerprint::shard(n) equals the fingerprint's value modulo n, which is always less than n."
kind = "domain"
property = "model-based"
requires = ["unit", "property"]
rationale = """
Insert and lookup route by this function on different nodes and at
different times. It must be a pure function of the fingerprint and the shard
count, with no process state, or a span indexed on one shard would be
looked up on another. The spec tests check range, repeatability and the
value on fixed inputs; the property test covers all values.
"""

[evidence]
unit = ["crosstalk_spec::tests::provenance::fingerprint_shard_is_in_range", "crosstalk_spec::tests::provenance::fingerprint_shard_is_stable", "crosstalk_spec::tests::provenance::single_shard_owns_everything"]
property = "crosstalk_provenance::props::shard_is_fingerprint_modulo_shards"

[evidence-review]
unit = { agent = "true", human = "false" }
property = { agent = "false", human = "false" }
