[invariant]
id = "reconstruct.delta.new-inputs-are-request-suffix"
statement = "For a full-history exchange threaded as Starts, Extends or Forks, the delta's new_inputs are the request's non-system messages after the first n of them, in order, less those reconstruct.delta.excludes-seen-elsewhere withholds, where n is zero for Starts, the number of non-system messages in the stored history for Extends, and shared_prefix for Forks."
kind = "domain"
property = "postcondition"
requires = ["property"]
rationale = """
Read-side detection scans only new_inputs. Dropping a new message misses a
transmission; including an old one re-scans it and double-counts matches.
Within a conversation the rule is positional, not a set difference, so a
tool result that repeats an earlier message of the same conversation
verbatim is still scanned; only a message another conversation of the
cluster already holds is withheld (reconstruct.delta.excludes-seen-elsewhere). The system
message travels in new_system instead.
"""

[evidence]
property = "crosstalk_reconstruct::tests::thread_props::new_inputs_are_request_suffix"

[evidence-review]
property = { agent = "true", human = "false" }
