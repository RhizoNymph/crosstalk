[invariant]
id = "topology.filter.unconfirmed-changes-no-transmission-view"
statement = "For any transmission subject and filter, TopologyFilter::admits returns the same under UnconfirmedChannels::Include and Exclude, all other fields equal."
kind = "domain"
property = "metamorphic"
requires = ["unit", "property"]
rationale = """
Linked views count confirmed transmissions between different agents,
and a channel such a transmission is routed through is confirmed by it, so
"confirmed only" has nothing to remove there. Keeping admits independent of
it means the topology, series, search and projections a cited URL shows do
not change when only the channel confirmation filter does.
"""

[evidence]
unit = [
    "crosstalk_spec::tests::confirmation::unconfirmed_channels_change_no_transmission_view",
]
property = "crosstalk::topology::props::unconfirmed_filter_keeps_transmission_views"

[evidence-review]
unit = { agent = "true", human = "false" }
property = { agent = "false", human = "false" }
