[invariant]
id = "surface.version.current-is-catalog-active"
statement = "A topology, series, search, edge_transmissions or fit_projection call whose filter selects Current, on its first page, is computed under and reports the version that is Active in the TopicCatalog's history when the call is served."
kind = "domain"
property = "postcondition"
requires = ["unit", "integration"]
rationale = """
L7 switches its buckets before the catalog marks the version active, so if
each store resolved Current from its own state, the graph and search could
answer the same request under different versions for a moment and the views
would not link. Resolving every view against the catalog gives one answer,
and L7 always retains the version the catalog calls active (it keeps the
active one and the one before it).
"""

[evidence]
unit = "crosstalk_spec::tests::topic_version::current_resolves_to_the_active_version"
integration = "crosstalk::surface::integration::current_selector_follows_catalog_activation"

[evidence-review]
unit = { agent = "true", human = "false" }
integration = { agent = "false", human = "false" }
