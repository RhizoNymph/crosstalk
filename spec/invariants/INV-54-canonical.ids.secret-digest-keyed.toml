[invariant]
id = "canonical.ids.secret-digest-keyed"
statement = "Every CredentialHash and AccountHash is the BLAKE3 keyed hash of the raw value under the deployment secret of the SecretVersion it records, never an unkeyed digest."
kind = "confidentiality"
requires = ["unit", "lint"]
rationale = """
Credential and account digests are stored and published as identity
evidence. An unkeyed digest lets anyone holding a database dump or the
event stream confirm a guessed or leaked API key or account id offline.
Keying with a secret that never leaves the deployment prevents that. The
recorded version must be the one actually used, or identity resolution
would compare digests under different keys as if they were comparable.
from_keyed_digest accepts any version and digest, so the lint confines its
callers to the keyed hasher; the unit test checks known-answer vectors per
version against blake3 keyed_hash and that they differ from the plain hash.
"""

[evidence]
unit = "crosstalk::canonical::tests::secret_digests_use_their_versions_key"
lint = "lint:secret-digest-only-from-keyed-hasher"

[evidence-review]
unit = { agent = "false", human = "false" }
lint = { agent = "false", human = "false" }
