[invariant]
id = "flow.transmission.dismiss-suspected-only"
statement = "TransmissionState::dismiss moves Suspected to Discarded with reason Dismissed and the same co-accesses, and returns NotSuspected and leaves every other state unchanged."
kind = "domain"
property = "postcondition"
requires = ["unit"]
rationale = """
Only access-pattern evidence is a matter of judgement. A confirmed
transmission has content evidence and dismissing it would erase a real
communication; an awaiting one has not finished collecting evidence. The
co-accesses stay so the dismissed suspicion remains auditable.
"""

[evidence]
unit = [
    "crosstalk_spec::tests::flow::dismiss_discards_a_suspected_transmission_with_its_co_accesses",
    "crosstalk_spec::tests::flow::only_suspected_transmissions_can_be_discarded",
]

[evidence-review]
unit = { agent = "true", human = "false" }
