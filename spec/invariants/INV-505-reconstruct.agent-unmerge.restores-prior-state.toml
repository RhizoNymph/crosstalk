[invariant]
id = "reconstruct.agent-unmerge.restores-prior-state"
statement = "After IdentityResolver::unmerge(a) returns Ok, a's state is the prior state its Merged record held."
kind = "domain"
property = "postcondition"
requires = ["unit"]
rationale = """
Restore exactly: an Established agent that was merged comes back
Established with its original since time, so unmerging a mistaken merge
does not demote the agent or rewrite when it was first seen.
`AgentState::unmerged` gives that state.
"""

[evidence]
unit = "crosstalk::reconstruct::tests::unmerge_restores_prior_state"

[evidence-review]
unit = { agent = "false", human = "false" }
