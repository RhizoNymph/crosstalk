[invariant]
id = "ingress.credential.absent-from-telemetry"
statement = "No log record, metric label, trace attribute or error value produced by the proxy contains a raw credential."
kind = "confidentiality"
requires = ["type", "unit"]
rationale = """
Logs and traces reach systems with far wider access than the proxy
process. A leaked raw credential can be spent; a leaked deployment secret
lets anyone confirm guessed credentials against stored digests. Holding
both in types whose Debug and Display redact them makes an accidental log
line print a placeholder, and a capturing subscriber test checks every
scheme.
"""

[evidence]
type = ["crosstalk::ingress::credential::RawCredential", "crosstalk::ingress::credential::DeploymentSecret"]
unit = "crosstalk::ingress::tests::credential::raw_credential_and_secret_absent_from_logs_and_errors"

[evidence-review]
type = { agent = "false", human = "false" }
unit = { agent = "false", human = "false" }
