[invariant]
id = "surface.live.filter-admits"
statement = "LiveScope::admitted_by admits a Global scope under every TopologyFilter, and admits a Scoped one exactly when, for every non-empty list in the filter, the scope has a key in that list (one of its agents, its channel, its route kind or its topic), with agent ids on both sides resolved through merges and channel ids on both sides resolved through supersession."
kind = "domain"
property = "postcondition"
requires = ["unit"]
rationale = """
The live filter must mean what it means for a graph query, so the UI can
use the filter it already applies to the topology view. A dimension the
update lacks never matches a restricting filter: a channel-subject update
has no agents, so an agent filter excludes it, and an unclassified
transmission has no topic, so a topic filter excludes it, as outliers are
excluded from a topic-filtered graph. Global updates
(TopicVersionActivated) concern the whole graph and always pass, so a
filtered view still learns to refetch. Resolving channels means a stream
filtered on a channel keeps receiving its updates after a promotion
supersedes it.
"""

[evidence]
unit = ["crosstalk_spec::tests::live::empty_filter_admits_everything", "crosstalk_spec::tests::live::global_updates_pass_any_filter", "crosstalk_spec::tests::live::agent_filter_matches_sender_or_reader", "crosstalk_spec::tests::live::channel_filter_keeps_only_those_channels", "crosstalk_spec::tests::live::route_kind_filter_matches_route", "crosstalk_spec::tests::live::topic_filter_never_matches_a_missing_topic", "crosstalk_spec::tests::live::filter_fields_combine_with_and"]

[evidence-review]
unit = { agent = "true", human = "false" }
