[invariant]
id = "surface.query.agent-reads-need-view"
statement = "QueryApi::agent and agent_names return Forbidden with missing View, reading nothing, when the caller lacks View."
kind = "confidentiality"
requires = ["unit"]
rationale = """
An agent's detail and names expose identity structure (evidence, aliases,
merges, labels) at the same level as the topology view and the agents list
(surface.query.list-unauthorized-forbidden), and no message text, so View
is enough and is required. The check is per endpoint, so a new read
without one fails a test rather than opening a door.
"""

[evidence]
unit = "crosstalk::surface::tests::agent_reads_without_view_forbidden"

[evidence-review]
unit = { agent = "false", human = "false" }
