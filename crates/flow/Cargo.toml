[package]
name = "crosstalk-flow"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "L5 flow for crosstalk: resource extraction, the channel registry, the correlator and the verdict store."

[lints]
workspace = true

[dependencies]
crosstalk-spec = { path = "../../spec" }
crosstalk-store = { path = "../store" }
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync"] }
tracing.workspace = true

[dev-dependencies]
crosstalk-memory = { path = "../memory" }
proptest.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
