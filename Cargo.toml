[workspace]
members = ["spec", "crates/*", "ui"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

# Clippy runs with its default lint set; scripts/check.sh denies every warning.
[workspace.lints.clippy]

# Shared pins. Only what a member uses today; a crate that needs another
# dependency adds its pin here (exact, `=`, matching the UI where they overlap).
[workspace.dependencies]
anyhow = "=1.0.104"
base64 = "=0.22.1"
blake3 = "=1.8.7"
bytes = "=1.12.1"
clap = { version = "=4.6.7", features = ["derive"] }
flate2 = "=1.1.10"
http-body-util = "=0.1.5"
hyper = "=1.11.1"
hyper-rustls = { version = "=0.27.10", default-features = false }
hyper-util = "=0.1.21"
parquet = { version = "=60.0.0", default-features = false, features = ["json", "snap"] }
proptest = { version = "=1.11.0", default-features = false, features = ["std"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = { version = "=0.11.0", default-features = false }
sqlx = { version = "=0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "migrate", "macros"] }
tempfile = "=3.27.0"
thiserror = "=2.0.21"
toml = "=1.1.6"
tokio = "=1.53.1"
tower-service = "=0.3.3"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", default-features = false }
unicode-normalization = { version = "=0.1.25", default-features = false, features = ["std"] }
url = "=2.5.8"
zstd = { version = "=0.13.3", default-features = false }
