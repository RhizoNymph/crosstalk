[invariant]
id = "flow.channel-reads.list-matches-filter"
statement = "A full traversal of ChannelReads::channels for a filter lists every stored channel ChannelFilter::matches keeps exactly once, newest id first, each equal to ChannelReads::channel of its id; a cursor presented with another filter is InvalidCursor."
kind = "domain"
property = "model-based"
requires = ["property"]
rationale = """
QueryApi::channels pages over this read and QueryApi::channel heads a
channel page with the other, so both must agree on the stored record (a
superseded channel as itself, with its supersession) and the list must be
stable under paging. Filtering before paging keeps every page full of
matching rows; binding the filter to the cursor stops a client from
continuing one traversal under another filter.
"""

[evidence]
property = "crosstalk_flow::registry::tests::channel_reads_agree_with_reference_model"

[evidence-review]
property = { agent = "false", human = "false" }
