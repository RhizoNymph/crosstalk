[invariant]
id = "reconstruct.delta.compaction-excludes-carried-over"
statement = "A Compacts delta's new_inputs are the request's messages in order, without the system message and without every message whose hash is in the predecessor's stored history."
kind = "domain"
property = "postcondition"
requires = ["property"]
rationale = """
A compacted request carries a summary plus messages kept from the
predecessor. The kept messages were already scanned there; scanning them
again would report every match in them a second time. The summary and
anything new are still scanned, since a summary can relay another agent's
text.
"""

[evidence]
property = "crosstalk::reconstruct::tests::compaction_new_inputs_exclude_carried_over"

[evidence-review]
property = { agent = "false", human = "false" }
