[invariant]
id = "ingress.credential.absent-end-to-end"
statement = "No 12-byte window of the secret part of a request's bearer token appears in any log line, stored blob, exchange-log record or bus envelope the gateway produces from that exchange, nor in any L8 surface answer about it; the token still reaches the upstream unchanged."
kind = "confidentiality"
requires = ["integration"]
rationale = """
OAuth access tokens spend a user's Claude subscription. INV-12 keeps them
out of RawExchange, the one value that leaves the proxy's hot path; this
checks the whole running gateway, where a later stage (a log line, the
blob store, the exchange log, an event, the operator API) could still
carry one. Windows rather than the whole token, so a truncated or
re-encoded copy is caught too; the public sk-ant-oat01- shape is not a
secret and is skipped.
"""

[evidence]
integration = [
    "crosstalk_gateway::subscription::subscription_tokens_pass_through_and_never_persist",
    "crosstalk_e2e::smoke::subscription::the_relay_is_detected_and_no_answer_holds_a_token",
]

[evidence-review]
integration = { agent = "true", human = "false" }
