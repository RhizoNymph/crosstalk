[invariant]
id = "flow.transmission.dismiss-races-late-match"
statement = "When a dismissal and a late content match for one Suspected transmission race, exactly one applies: either the transmission is confirmed and the dismissal returns NotSuspected, or it is discarded as Dismissed and the match opens a new transmission."
kind = "coordination"
requires = ["dst"]
rationale = """
The surface and the content-match consumer act on the same transmission
from different tasks. Applying both would either confirm a transmission
the operator was told is dismissed or discard content evidence. The
dismissal enters the owning correlator shard's input channel, so the two
are ordered there.
"""

[evidence]
dst = "crosstalk::flow::tests::dst_dismiss_races_late_match"

[evidence-review]
dst = { agent = "false", human = "false" }
