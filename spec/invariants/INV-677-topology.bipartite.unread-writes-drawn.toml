[invariant]
id = "topology.bipartite.unread-writes-drawn"
statement = "The access edges of EdgeStore::channel_topology are exactly the access buckets in the window that TopologyFilter::admits_access keeps, resolved to canonical agents and channels and summed per agent, channel and operation, whether or not any transmission used the channel."
kind = "domain"
property = "postcondition"
requires = ["unit", "property"]
rationale = """
The early stage of a hijacked wiki is writes that nobody has read yet.
Deriving the channel view from transmissions would hide exactly that
stage; counting accesses from their own aggregate shows it.
"""

[evidence]
unit = [
    "crosstalk_spec::tests::graph::writes_nobody_read_are_drawn",
    "crosstalk::topology::tests::channel_topology_counts_unread_writes",
]
property = "crosstalk::topology::props::channel_topology_accesses_match_buckets"

[evidence-review]
unit = { agent = "false", human = "false" }
property = { agent = "false", human = "false" }
