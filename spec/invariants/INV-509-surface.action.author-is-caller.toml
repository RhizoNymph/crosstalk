[invariant]
id = "surface.action.author-is-caller"
statement = "For MergeAgents, Unmerge, RenameAgent, CreateRule, UpdateRule and SetRuleEnabled, the operator the surface passes to L3 or L6 is the Caller's OperatorId and any time it passes is the time it accepted the action."
kind = "domain"
property = "postcondition"
requires = ["unit"]
rationale = """
These actions carry no author or time, apart from the MergeRequest, which
the surface builds with MergeAuthor::Operator of the caller, so a client
cannot claim to be another operator. Merge records, reversals, vetoes,
rule creators and rename events all name who did it; a fixed service
identity there would make them unattributable.
"""

[evidence]
unit = "crosstalk::surface::tests::identity_and_rule_actions_stamp_caller"

[evidence-review]
unit = { agent = "false", human = "false" }
