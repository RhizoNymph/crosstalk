[invariant]
id = "surface.action.alert-lifecycle-model"
statement = "Whether an Acknowledge or Resolve is accepted, and the alert state it leaves, equal the alert lifecycle model applied to the alert's prior state, the Caller's OperatorId, the acceptance time and the requested note."
kind = "domain"
property = "model-based"
requires = ["property", "unit"]
rationale = """
The model is the operator half of the lifecycle in aggregates/alert/mod.rs
(AlertActions in L6): Acknowledge moves Open to Acknowledged{by, at};
Resolve moves Acknowledged to Resolved{by, at, note}; both return Applied.
An Acknowledge on Acknowledged is accepted, changes nothing and returns
Unchanged. A Resolve on Open returns Conflict(AlertNotAcknowledged): the
alert is acknowledged first. Every other pair (Acknowledge or Resolve on
Resolved or Suppressed) returns Conflict(AlertNotActive) and changes
nothing, as AlertState::is_active documents. An unknown alert returns
NotFound. Without this, a
suppressed alert could be reopened as acknowledged, or a resolve could
overwrite who resolved it.
"""

[evidence]
property = "crosstalk_surface::tests::prop_alert_actions_match_lifecycle_model"
unit = "crosstalk_surface::tests::alert_action_transition_table"

[evidence-review]
property = { agent = "false", human = "false" }
unit = { agent = "false", human = "false" }
