[invariant]
id = "surface.wire.authority-not-decoded"
statement = "The gateway decodes client input only as a WireRequest type; Caller implements neither Serialize nor Deserialize and nothing converts decoded data into one (an audit or export record keeps a CallerSnapshot, plain data that is not a Caller); and no type holding a value the server stamps (Promotion, MergeRequest, OperatorAction, verdict records, pins, policy decisions, audit, export and projection records, caller snapshots, alerts, bus envelopes) is a WireRequest, a client sending an ActionRequest that the surface stamps with the Caller instead."
kind = "representation"
requires = ["type", "unit"]
rationale = """
Who is asking and when the gateway accepted the request are the server's
to decide: a Caller comes from the verified session through the operator
directory, and an author or acceptance time is stamped from it. If a
client could send a Caller, or a record with its own author or time, it
could act as another operator or backdate a decision. The HTTP layer's
only decoder is bounded on WireRequest, the compile-time assertions in
wire::authority fail to build if Caller gains a serde trait or a stamped
type becomes a request, every request golden is checked for stamp keys,
and strict decoding turns a smuggled author field into a decode error.
Audit records are read back by the UI, so they decode; they therefore keep
a CallerSnapshot of their caller (operator and permissions as plain data),
never a Caller, so decoding the log yields nothing that can act. An
operator action holds a merge's author, so a client sends an ActionRequest
without it, and ActionRequest::into_action stamps the caller's operator.
"""

[evidence]
type = [
    "crosstalk_spec::wire::decode_request",
    "crosstalk_spec::wire::authority",
    "crosstalk_spec::interfaces::l8_surface::CallerSnapshot",
    "crosstalk_spec::interfaces::l8_surface::ActionRequest::into_action",
]
unit = [
    "crosstalk_spec::tests::wire::requests::a_smuggled_author_is_a_decode_error",
    "crosstalk_spec::tests::wire::requests::authority_keys_are_found_at_any_depth",
    "crosstalk_spec::tests::wire::alerts::alert_list_request_and_response_golden",
    "crosstalk_spec::tests::wire::paging::paging_goldens",
    "crosstalk_spec::tests::wire::analysis::rules::user_rules_golden_as_requests",
    "crosstalk_spec::tests::wire::analysis::rules::user_rules_refuse_what_a_client_must_not_send",
    "crosstalk_spec::tests::wire::analysis::topics::topic_model_versions_golden_as_requests",
    "crosstalk_spec::tests::wire::analysis::projections::projection_params_golden_as_a_request",
    "crosstalk_spec::tests::wire::surface_actions::actions::every_action_request_golden",
    "crosstalk_spec::tests::wire::surface_actions::actions::a_merge_is_authored_by_the_caller",
    "crosstalk_spec::tests::wire::surface_actions::actions::action_requests_refuse_stamps_unknown_fields_and_variants",
    "crosstalk_spec::tests::wire::surface_actions::audit::audit_list_request_and_response_golden",
    "crosstalk_spec::tests::wire::surface_actions::audit::caller_snapshot_golden_and_of_a_caller",
    "crosstalk_spec::tests::wire::surface_actions::lists::channel_filters_golden_with_every_origin_filter",
    "crosstalk_spec::tests::wire::surface_actions::lists::alert_rule_filters_and_searches_golden",
]

[evidence-review]
type = { agent = "true", human = "false" }
unit = { agent = "true", human = "false" }
