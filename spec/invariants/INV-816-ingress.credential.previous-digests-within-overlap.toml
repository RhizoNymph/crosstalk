[invariant]
id = "ingress.credential.previous-digests-within-overlap"
statement = "The proxy records previous_digests in an exchange's ClientContext exactly when a previous secret is configured and the exchange's started_at is before that secret's overlap_ends; from overlap_ends on, no digest under the previous version is computed."
kind = "domain"
property = "postcondition"
requires = ["unit"]
rationale = """
A rotation keeps the old secret loaded so identity resolution can link an
agent's evidence across the change, but only for a bounded overlap: past
it, digests under a retired key would keep that key in use and let it
confirm guessed credentials against new evidence. The overlap ends at a
configured instant, the same on every node, and is tested at the
exchange's start, so every exchange of a request carries one decision and
a node's own clock reading at hashing time never decides it.
"""

[evidence]
unit = "crosstalk_ingress::tests::credential::previous_digests_stop_at_overlap_end"

[evidence-review]
unit = { agent = "true", human = "false" }
