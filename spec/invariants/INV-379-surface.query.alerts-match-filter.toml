[invariant]
id = "surface.query.alerts-match-filter"
statement = "A full traversal of QueryApi::alerts returns exactly the stored alerts whose state kind is in the filter's states (any state when the list is empty) and, when the filter names a channel, whose subject resolves (AlertSubject::resolved) to that channel's canonical channel or is a transmission whose route resolves to it."
kind = "domain"
property = "postcondition"
requires = ["unit", "property"]
rationale = """
The alert inbox is how operators find work. Dropping a matching alert
hides something that needs triage, and an alert from another channel in a
channel's view misleads the reviewer deciding that channel's policy. The
channel filter includes transmission alerts on that channel, as
AlertFilter documents, because sanctioning a channel leaves them active,
so the channel view is where they get reviewed. Alerts stay stored under
the ids they were raised with, so channels are compared resolved through
supersession: an alert raised on a channel a promotion later absorbed
shows in the promoted channel's view
(surface.query.alerts-resolve-supersession).
"""

[evidence]
unit = "crosstalk_surface::tests::alert_filter_cases"
property = "crosstalk_surface::tests::prop_alerts_match_filter_model"

[evidence-review]
unit = { agent = "false", human = "false" }
property = { agent = "false", human = "false" }
