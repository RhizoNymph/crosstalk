[invariant]
id = "flow.registry.lookup-precedence"
statement = "ChannelRegistry::lookup agrees with a reference model that returns Known with the resource's canonical channel (the channel that superseded the one it is stored on, else that channel) for a resource already on a channel, otherwise Declared for a locator matching a declared pattern, and otherwise New."
kind = "domain"
property = "model-based"
requires = ["property", "integration"]
rationale = """
Known wins over Declared so that a declaration added later does not
silently move a resource, and the history already correlated on it, to
another channel. Declared wins over New so that traffic on a configured
channel is never reported as a newly discovered one. Known names the
canonical channel so that a superseded channel takes no new accesses: its
resources' traffic is recorded on the channel that absorbed it
(flow.registry.lookup-never-superseded), and every AccessRecorded names a
canonical channel.
"""

[evidence]
property = "crosstalk_flow::registry::tests::lookup_agrees_with_precedence_model"
integration = "crosstalk_flow::registry::integration::pg_lookup_precedence"

[evidence-review]
property = { agent = "false", human = "false" }
integration = { agent = "false", human = "false" }
