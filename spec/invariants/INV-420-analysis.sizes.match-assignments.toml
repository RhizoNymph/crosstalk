[invariant]
id = "analysis.sizes.match-assignments"
statement = "TopicCatalog::sizes for a version and window equals a reference count that takes every TopicAssignment under that version whose transmission was confirmed in the window (every one when there is no window), sums transmissions and matched_bytes per assigned topic and over outliers, and lists every topic of the version once, with no stats for topics that counted nothing."
kind = "domain"
property = "model-based"
requires = ["property", "integration"]
rationale = """
Sizes are read from topic assignments rather than edge buckets because
edge buckets of older versions are dropped (topology.version.drops-superseded)
while the topic history must still size superseded versions. As a
consequence they include transmissions between agents later merged into
one, which graphs and series drop as self-edges. Listing every topic, even
an empty one in the window, lets the UI show a topic that went quiet.
"""

[evidence]
property = "crosstalk::analysis::tests::sizes_match_assignment_count"
integration = "crosstalk::analysis::integration::pg_sizes_match_assignment_count"

[evidence-review]
property = { agent = "false", human = "false" }
integration = { agent = "false", human = "false" }
