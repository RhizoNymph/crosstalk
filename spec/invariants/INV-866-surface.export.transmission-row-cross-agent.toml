[invariant]
id = "surface.export.transmission-row-cross-agent"
statement = "TransmissionRow::new refuses a summary whose delivery's sender is its reader with InvalidTransmissionRow::WithinOneAgent, so no transmissions export holds a transmission whose agents have merged into one."
kind = "representation"
requires = ["type", "unit"]
rationale = """
An export is the record a team analyses offline, and it must count what
the UI counts: a transmission between two ids of one merged agent is not a
transmission. Refusing the row by type means an export cannot carry one
even if a source forgets the filter.
"""

[evidence]
type = "crosstalk_spec::interfaces::l8_surface::export::rows::TransmissionRow::new"
unit = "crosstalk_spec::tests::confirmation::an_export_row_is_never_a_transmission_within_one_agent"

[evidence-review]
type = { agent = "true", human = "false" }
unit = { agent = "true", human = "false" }
