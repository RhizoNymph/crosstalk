[invariant]
id = "provenance.span.relay-source-exists"
statement = "A Relayed SpanDraft's RelaySource::Input names a message among the exchange's inputs, and its RelaySource::Span names an indexed span."
kind = "domain"
property = "postcondition"
requires = ["property"]
rationale = """
A relay claim is evidence that text flowed from the source to this agent.
A source that does not contain the text fabricates that edge, and a source
outside the exchange's inputs names something the agent never saw.
"""

[evidence]
property = "crosstalk::provenance::props::relayed_span_source_contains_text"

[evidence-review]
property = { agent = "false", human = "false" }
