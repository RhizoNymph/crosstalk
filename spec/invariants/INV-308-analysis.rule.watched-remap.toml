[invariant]
id = "analysis.rule.watched-remap"
statement = "When TopicVersionReady for version V is processed, a WatchedTopic rule current on V's predecessor whose every topic's best link in the stored lineage (the most similar centroid among V's topics, ties to the lower id) reaches remap_threshold gets version V and each topic replaced by its best link, each new topic listed once."
kind = "domain"
property = "postcondition"
requires = ["unit", "property"]
rationale = """
Topic ids are only meaningful within one fit, so without remapping every
watchlist would go silent at each re-fit. The lineage records, for each
old topic, the new topic whose Topic::centroid is most similar, which
carries the operator's intent forward when the new fit has a clearly
corresponding topic; the threshold stops it drifting onto an unrelated
one. Reading the stored lineage keeps the rules and the UI's lineage view
in agreement (analysis.lineage.remap-uses-lineage). Remapping on
TopicVersionReady, not at fit time, switches the rule in step with the
classifications of new confirmations, which stay on the old version until
then.
"""

[evidence]
unit = ["crosstalk::analysis::tests::watched_rule_remaps_to_most_similar_centroid", "crosstalk::analysis::tests::watched_rule_keeps_old_version_until_version_ready"]
property = "crosstalk::analysis::tests::remapped_topics_are_argmax_centroids_of_new_version"

[evidence-review]
unit = { agent = "false", human = "false" }
property = { agent = "false", human = "false" }
