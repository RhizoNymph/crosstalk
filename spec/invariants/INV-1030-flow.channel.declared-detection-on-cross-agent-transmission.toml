[invariant]
id = "flow.channel.declared-detection-on-cross-agent-transmission"
statement = "Every transition the registry applies to a DeclaredDetection is AwaitingTraffic to Unused on the idle timeout, or AwaitingTraffic or Unused to InUse(Active) on the first cross-agent transmission recorded through the channel (opened by a co-access or confirmed), active since that transmission opened or was confirmed; accesses alone leave it awaiting traffic or unused."
kind = "domain"
property = "invariant"
requires = ["unit", "property"]
rationale = """
A declared channel is operator intent: it exists before any traffic, but
it carries traffic only once two agents communicate through it. Moving it
to InUse on any access would report a channel only one agent touched as in
use, and keep a sanctioned but genuinely unused channel from ever raising
SanctionedUnused. InUse never returns to AwaitingTraffic or Unused: a
channel that fell back to Unused after traffic would publish a false
DeclaredChannelUnused. Replaces flow.channel.declared-detection-model,
which moved a declared channel to InUse(Observed) on an access.
"""

[evidence]
unit = "crosstalk_memory::flow::registry::tests::traffic::a_declared_channel_is_in_use_from_its_first_cross_agent_transmission"
property = "crosstalk_flow::store::tests::detection::declared_detection_transitions"

[evidence-review]
unit = { agent = "true", human = "false" }
property = { agent = "true", human = "false" }
