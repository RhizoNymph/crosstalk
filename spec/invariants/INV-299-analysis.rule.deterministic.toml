[invariant]
id = "analysis.rule.deterministic"
statement = "Evaluating the same rule against the same envelope with equal context lookups returns equal results."
kind = "domain"
property = "metamorphic"
requires = ["property"]
rationale = """
Replaying the bus must reproduce the same drafts, and two alert consumers
racing on a redelivered envelope must agree on what to triage. Evaluation
reads no clock, randomness or state beyond the envelope and the
RuleContext (channel_policy and transmission_embedding).
"""

[evidence]
property = "crosstalk_analysis::alerts::eval::tests::rule_evaluation_is_deterministic"

[evidence-review]
property = { agent = "true", human = "false" }
