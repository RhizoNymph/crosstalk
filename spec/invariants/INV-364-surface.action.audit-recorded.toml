[invariant]
id = "surface.action.audit-recorded"
statement = "After an operator action returns Ok, the audit log holds an AuditEntry for it whose body is an OperatorRecord with a CallerSnapshot of the Caller, the action and AuditOutcome::Succeeded of the returned ActionOutcome, at the time the action was accepted."
kind = "domain"
property = "postcondition"
requires = ["unit", "integration"]
rationale = """
Policy changes and merges alter what the gateway reports from then on, so
an operator must be able to answer who sanctioned a channel or merged two
agents, and when. The effect commits in the owning layer's store, so a
durable surface records a write-ahead AuditIntent before it and appends
the entry (removing the intent) after it; a crash in between leaves an
Interrupted entry at start (surface.audit.no-silent-effect), so an action
cannot apply without a record.
Refused and forbidden calls are recorded too
(surface.audit.every-call-recorded).
"""

[evidence]
unit = "crosstalk_surface::tests::actions::successful_actions_are_audited"
integration = "crosstalk_surface::integration::audit_record_committed_with_action"

[evidence-review]
unit = { agent = "true", human = "false" }
integration = { agent = "false", human = "false" }
