[invariant]
id = "surface.audit.author-matches-body"
statement = "An AuditEntry's author is Config exactly when its body is a ConfigRecord, and otherwise is the OperatorId of the Caller its OperatorRecord was authenticated as."
kind = "representation"
requires = ["type", "unit"]
rationale = """
A config change must not pass for an operator action, nor an operator's
call for config. The author is derived from the body rather than stored
beside it, so the two cannot disagree, and a ConfigChange is a type of its
own rather than an OperatorAction with a made-up author.
"""

[evidence]
type = "crosstalk_spec::interfaces::l8_surface::audit::AuditEntry::by"
unit = "crosstalk_spec::tests::audit::entry_author_follows_its_body"

[evidence-review]
type = { agent = "true", human = "false" }
unit = { agent = "true", human = "false" }
