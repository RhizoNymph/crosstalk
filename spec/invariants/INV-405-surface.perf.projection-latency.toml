[invariant]
id = "surface.perf.projection-latency"
statement = "QueryApi::projection for a ready projection of 100,000 points returns its stored frame within 1 s at p99."
kind = "performance"
requires = ["bench"]
rationale = """
The UMAP view loads a stored projection when an operator opens it or
follows a citation. The fit runs in the background, so a read only fetches
the job record and the frame bytes and checks the frame; it never runs
UMAP, samples or resolves agents. A 100,000-point frame is about 5 MB. The
figures are a proposed initial threshold.
"""

[evidence]
bench = "crosstalk::surface::bench::projection_frame_100k_p99"

[evidence-review]
bench = { agent = "false", human = "false" }
