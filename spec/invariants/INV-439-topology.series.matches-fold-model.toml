[invariant]
id = "topology.series.matches-fold-model"
statement = "series returns the same groups and values as a reference fold that takes the applied contributions classified under the active topic version (one per transmission), maps from and to through AgentDirectory::canonical, drops the resulting self-edges, keeps those that pass the filter and whose at lies in the grid's window, assigns each to the point whose step contains its at, keys it by the grouping (nothing, the classification's topic or outlier, the route's kind, or (from, to, route)), sums its stat under the weighting per key and point, and leaves out grouped keys whose values are all zero."
kind = "domain"
property = "model-based"
requires = ["property", "integration"]
rationale = """
This is the series counterpart of topology.graph.matches-fold-model, with
the same reference: InMemoryEdgeStore's fold over contributions. Stating
both against one fold is what makes series and graph count the same
transmissions: same version, same alias resolution, same self-edge rule,
same filter semantics. TimescaleEdgeStore answers from continuous
aggregates, so the integration test checks it against the fold too.
"""

[evidence]
property = "crosstalk::topology::props::series_matches_reference_fold"
integration = "crosstalk::topology::integration::timescale_series_matches_reference_fold"

[evidence-review]
property = { agent = "false", human = "false" }
integration = { agent = "false", human = "false" }
