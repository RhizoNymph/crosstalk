[invariant]
id = "canonical.interface.send-futures"
statement = "Every async trait method in the spec's interfaces returns a Send future, and every associated stream or per-connection handle type is Send + 'static."
kind = "representation"
requires = ["type", "unit"]
rationale = """
Implementations run on tokio's multi-threaded runtime, which moves a task's
future between worker threads, so tokio::spawn and axum handlers require
Send futures. A native `async fn` in a trait promises nothing about Send:
code generic over the trait (a UI or client generic over QueryApi, a
consumer loop generic over EventBus) cannot prove its futures Send without
return-type notation, and compiles only against one concrete type the
compiler can see through. So each method is declared in its desugared form,
`fn ...(...) -> impl Future<Output = T> + Send`, which implementations still
satisfy by writing `async fn`. The streams and handles a task keeps across
awaits or hands to another task (EventBus::Subscription, LiveFeed::Stream,
QueryApi::ExportRows, ExportSource::Rows, ProviderAdapter::Framer and Tap)
are bounded Send + 'static for the same reason. RuleContext is Sync because
AlertRuleEval::evaluate borrows a context into its Send future. The traits
do not require Self: Send + Sync; a host that shares an implementation
across tasks adds those bounds itself.
"""

[evidence]
type = [
    "crosstalk_spec::interfaces::l0_ingress::ProviderAdapter",
    "crosstalk_spec::interfaces::l2_transport::EventBus",
    "crosstalk_spec::interfaces::l2_transport::Subscription",
