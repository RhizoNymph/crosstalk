[package]
name = "crosstalk-api"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "The HTTP and SSE server for the crosstalk L8 surface, and the in-process surface over the reference stores."

[lints]
workspace = true

[features]
# A surface over the synthetic world for tests and demos: seeded memory
# stores, in process or served over HTTP (`world`).
world = ["dep:crosstalk-world"]

[dependencies]
crosstalk-spec = { path = "../../spec" }
crosstalk-analysis = { path = "../analysis" }
crosstalk-canonical = { path = "../canonical" }
crosstalk-flow = { path = "../flow" }
crosstalk-memory = { path = "../memory" }
crosstalk-provenance = { path = "../provenance" }
crosstalk-reconstruct = { path = "../reconstruct" }
crosstalk-store = { path = "../store" }
crosstalk-surface = { path = "../surface" }
crosstalk-topology = { path = "../topology" }
crosstalk-transport = { path = "../transport" }
crosstalk-world = { path = "../world", optional = true }
axum = { workspace = true, features = ["http1", "tokio", "tracing"] }
bytes.workspace = true
form_urlencoded.workspace = true
futures-util = { workspace = true, features = ["std"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "sync", "time"] }
tracing.workspace = true

[dev-dependencies]
crosstalk-conformance = { path = "../conformance" }
crosstalk-testkit = { path = "../testkit" }
http-body-util.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tower = { workspace = true, features = ["util"] }

[[test]]
name = "conformance"
required-features = ["world"]
