[invariant]
id = "flow.correlator.resource-shard-handoff"
statement = "Accesses on a resource on no channel are correlated by the shard of that resource, and when a channel is discovered from it, the evidence that shard holds for the resource moves to the shard of the new channel before any later access or content match on it is processed, so evidence recorded before and after the discovery meets on one shard."
kind = "coordination"
requires = ["dst"]
rationale = """
The co-access that discovers a channel pairs a write and a read made
before the channel existed; content that confirms the transmission and
later accesses arrive after, keyed by the new channel. Without the
handoff the open transmission and its content evidence would sit on
different shards and the transmission would never confirm, leaving the
channel unconfirmed for good.
"""

[evidence]
dst = "crosstalk_flow::consumer::tests::dst::discovery_moves_resource_evidence"

[evidence-review]
dst = { agent = "true", human = "false" }
