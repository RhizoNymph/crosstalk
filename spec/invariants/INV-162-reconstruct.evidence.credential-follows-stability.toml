[invariant]
id = "reconstruct.evidence.credential-follows-stability"
statement = "An exchange yields StableCredential evidence for a Stable credential, RotatingCredential evidence for a Rotating one, and no credential evidence for a Shared or missing one."
kind = "domain"
property = "postcondition"
requires = ["unit"]
rationale = """
A rotating OAuth or exchanged token changes on refresh, so treating it as a
stable key would split one agent into a new agent per refresh. A
self-hosted server's shared key is the same for every caller, so treating
it as evidence would collapse every caller of that upstream into one agent.
"""

[evidence]
unit = [
  "crosstalk_reconstruct::tests::api_key_yields_stable_credential",
  "crosstalk_reconstruct::tests::oauth_and_exchanged_tokens_yield_rotating_credential",
  "crosstalk_reconstruct::tests::server_key_and_no_credential_yield_no_credential_evidence",
]

[evidence-review]
unit = { agent = "false", human = "false" }
