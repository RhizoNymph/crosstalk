[invariant]
id = "reconstruct.agent-merge.records-restore-data"
statement = "When IdentityResolver::merge returns record m, m.source's state is Merged with m's id and its active state just before the merge as prior, and m.repointed lists exactly the agents that resolved to m.source before the merge."
kind = "domain"
property = "postcondition"
requires = ["unit", "integration"]
rationale = """
An unmerge reverts one record and can only restore what that record and
the merged agent hold. Without the prior state the agent would come back
Provisional and lose its Established standing; without the repointed list
the agents merged into it earlier would stay with the target and the
unmerge would split only one id off a cluster the operator meant to undo.
"""

[evidence]
unit = "crosstalk_spec::tests::agents::merge_repoints_agents_already_merged_into_the_source"
integration = "crosstalk_reconstruct::tests::pg_merge_records_prior_and_repointed"

[evidence-review]
unit = { agent = "true", human = "false" }
integration = { agent = "false", human = "false" }
