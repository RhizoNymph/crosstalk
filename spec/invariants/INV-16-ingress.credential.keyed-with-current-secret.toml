[invariant]
id = "ingress.credential.keyed-with-current-secret"
statement = "The CredentialHash and AccountHash the proxy records in a ClientContext's credential and account fields record the deployment's current SecretVersion, whatever the exchange's start time; only previous_digests records the previous version, and only inside its rotation overlap."
kind = "domain"
property = "postcondition"
requires = ["unit"]
rationale = """
Digests keyed with different secret versions never compare equal even for
the same credential. Recording the version lets identity resolution tell a
rotation from a new caller, and keying with the current version on every
node keeps digests comparable across the fleet.
"""

[evidence]
unit = "crosstalk_ingress::tests::credential::digests_use_current_secret_version"

[evidence-review]
unit = { agent = "true", human = "false" }
