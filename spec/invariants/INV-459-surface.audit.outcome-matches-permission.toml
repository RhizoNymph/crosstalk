[invariant]
id = "surface.audit.outcome-matches-permission"
statement = "An OperatorRecord's outcome is Forbidden exactly when the CallerSnapshot it keeps of its caller lacks its action's required permission, and then names that permission as missing."
kind = "representation"
requires = ["type", "unit"]
rationale = """
The permission is checked before any effect, so a forbidden caller cannot
have an action applied, rejected or found unchanged, and a permitted
caller cannot be forbidden. A record claiming otherwise would mislead
whoever investigates an incident from the log.
"""

[evidence]
type = "crosstalk_spec::interfaces::l8_surface::audit::OperatorRecord::new"
unit = ["crosstalk_spec::tests::audit::forbidden_record_requires_missing_permission", "crosstalk_spec::tests::audit::attempted_record_requires_permission", "crosstalk_spec::tests::audit::every_action_reports_its_kind_permission_and_subjects", "crosstalk_spec::tests::wire::surface_actions::audit::operator_records_refuse_outcomes_their_caller_contradicts", "crosstalk_spec::tests::audit_intents::interrupted_record_requires_permission", "crosstalk_spec::tests::audit_intents::intent_requires_permission"]

[evidence-review]
type = { agent = "true", human = "false" }
unit = { agent = "true", human = "false" }
