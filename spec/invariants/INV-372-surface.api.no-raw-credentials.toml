[invariant]
id = "surface.api.no-raw-credentials"
statement = "No QueryApi response, audit entry or surface log line contains a raw credential of any scheme or a raw account id; they appear at most as CredentialHash or AccountHash."
kind = "confidentiality"
requires = ["property", "unit"]
rationale = """
Agents are identified partly by the credential or account they present:
API keys, OAuth subscription tokens, exchanged tokens, server keys and
account ids. Each grants access to an upstream or a user's subscription;
showing one in the UI, a Slack message, a webhook body or a log would hand
it to everyone who reads those. Both hashes are keyed BLAKE3, so even the
digests cannot confirm a guessed value, and the surface never needs the
raw value. The property test feeds exchanges carrying marker credentials of
every scheme through the pipeline and checks every surface output for them.
"""

[evidence]
property = "crosstalk_surface::tests::prop_responses_never_contain_raw_credentials"
unit = ["crosstalk_surface::tests::agent_identity_rendered_as_credential_hash", "crosstalk_surface::tests::oauth_token_never_rendered"]

[evidence-review]
property = { agent = "false", human = "false" }
unit = { agent = "false", human = "false" }
