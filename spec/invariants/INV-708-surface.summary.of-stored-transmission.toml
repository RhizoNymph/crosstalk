[invariant]
id = "surface.summary.of-stored-transmission"
statement = "TransmissionSummary::of names the transmission's canonical reader, its route with the channel resolved through supersession and its opened time, and fills each field its state's SummaryState holds: the delivery with the canonical sender, Confirmed::at and Confirmed::matched_bytes, the topic with the page version's assignment, and the verdict with the current one, calling the verdict and topic lookups only for states that hold them."
kind = "domain"
property = "postcondition"
requires = ["unit"]
rationale = """
Every list of transmissions (explore selections, the evidence page header,
export) builds its rows with this one function, so rows agree with each
other and with the linked views, which resolve the same aliases. Which
fields a state holds is the type's (surface.summary.shape-follows-state);
this is what goes in them.
"""

[evidence]
unit = [
    "crosstalk_spec::tests::summary::the_row_names_canonical_agents_and_the_resolved_route",
    "crosstalk_spec::tests::summary::the_row_has_what_its_state_knows_and_nothing_else",
    "crosstalk_spec::tests::summary::a_classified_row_carries_the_topic_under_the_pages_version",
]

[evidence-review]
unit = { agent = "true", human = "false" }
