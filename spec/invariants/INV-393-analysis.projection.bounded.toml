[invariant]
id = "analysis.projection.bounded"
statement = "A ProjectionFrame holds exactly min(matching, limit) points for a sample size between 1 and 100,000, no transmission twice, and only finite coordinates."
kind = "representation"
requires = ["type", "unit"]
rationale = """
The sample size bounds fit time, frame size and canvas cost. Holding
exactly min(matching, limit) points lets the client show "n of m"
truthfully and know whether it is looking at a sample. A duplicate point
would be drawn twice and counted twice; a NaN coordinate breaks the
canvas's bounds. ProjectionFrame::new checks all three, and decode goes
through it, so a stored frame read back cannot break them either.
"""

[evidence]
type = ["crosstalk_spec::aggregates::projection::ProjectionLimit::new", "crosstalk_spec::aggregates::projection::frame::ProjectionFrame::new"]
unit = ["crosstalk_spec::tests::projection::projection_limit_rejects_zero_and_above_max", "crosstalk_spec::tests::projection_frame::new_rejects_a_count_other_than_min_of_matching_and_limit", "crosstalk_spec::tests::projection_frame::new_rejects_a_transmission_twice", "crosstalk_spec::tests::projection_frame::new_rejects_non_finite_coordinates", "crosstalk_spec::tests::projection::projection_joins_a_ready_job_and_its_frame"]

[evidence-review]
type = { agent = "true", human = "false" }
unit = { agent = "true", human = "false" }
