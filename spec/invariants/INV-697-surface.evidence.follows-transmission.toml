[invariant]
id = "surface.evidence.follows-transmission"
statement = "A TransmissionEvidence holds one MatchEvidence per content match of its transmission's Confirmed, in stored order, and none before confirmation, and one AccessDetail per distinct access its state's co-access records name, in order of first mention, each holding the resource its access touched."
kind = "representation"
requires = ["type", "unit"]
rationale = """
The evidence page explains one transmission.
TransmissionEvidence::assemble takes the list of matches and accesses from
the transmission itself and checks every detail it is handed, so the page
cannot show evidence of another transmission or silently miss a match or
an access.
"""

[evidence]
type = [
    "crosstalk_spec::interfaces::l8_surface::evidence::TransmissionEvidence::assemble",
    "crosstalk_spec::interfaces::l8_surface::evidence::AccessDetail::new",
]
unit = [
    "crosstalk_spec::tests::evidence::matches_follow_the_transmissions_content_in_order",
    "crosstalk_spec::tests::evidence::no_matches_before_confirmation_and_one_list_per_state",
    "crosstalk_spec::tests::evidence::accesses_are_the_distinct_co_access_accesses_in_order_of_mention",
    "crosstalk_spec::tests::evidence::a_detected_transmission_lists_no_accesses",
    "crosstalk_spec::tests::evidence::every_state_lists_both_accesses_of_each_co_access",
    "crosstalk_spec::tests::evidence::access_detail_rejects_another_resource",
    "crosstalk_spec::tests::evidence::a_detail_for_another_access_is_refused",
    "crosstalk_spec::tests::evidence::the_first_error_stops_assembly",
    "crosstalk_spec::tests::wire::surface_reads::evidence::transmission_evidence_is_decoded_through_assemble",
    "crosstalk_spec::tests::wire::surface_reads::evidence::access_details_are_decoded_through_their_constructor",
]

[evidence-review]
type = { agent = "true", human = "false" }
unit = { agent = "true", human = "false" }
