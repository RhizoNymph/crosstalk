[invariant]
id = "flow.channel.discovered-seed"
statement = "A channel created for a New lookup has a Seed whose resource is the accessed resource and whose first_access is the triggering access."
kind = "domain"
property = "postcondition"
requires = ["unit"]
rationale = """
A discovered channel exists only because of traffic, and its seed and
first access are the evidence for it. The NewChannel alert and the operator's
review point at them; a wrong seed sends the operator to the wrong resource.
"""

[evidence]
unit = "crosstalk::flow::channel::tests::discovered_channel_seeded_by_first_access"

[evidence-review]
unit = { agent = "false", human = "false" }
