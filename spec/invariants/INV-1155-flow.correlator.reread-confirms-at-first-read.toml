[invariant]
id = "flow.correlator.reread-confirms-at-first-read"
statement = "Through the live composition, when a reader reads a page again and the body still holds a span another agent wrote that the reader's earlier read of that page confirmed, the earlier read's transmission holds that span's match and no prediction falls at the later read's location of it, while text new to the reader in the later read is confirmed at the later read."
kind = "domain"
property = "postcondition"
requires = ["unit"]
rationale = """
A restatement of INV-1122 (`flow.correlator.reread-refreshes-delivery`)
end to end, over the gateway's live composition and the eval's alignment
rule, on the shape of collusion-wiki's dse/BridgeLAProd1782007689: an
append-only page each author edits more than once, reading it first each
time. The eval labelled every reread as a transmission, so the live
detector's wiki --demo recall was 0.670 with 63 of 65 misses rereads (62
of them Decoded([JsonString]) only because the run spans a newline),
which read as an L4 decode-path bug. The converter labels a reread as a
Reread negative control; this pins both halves: the first read is found,
the reread is not predicted, and new content read alongside the reread
still confirms.
"""

[evidence]
unit = [
    "crosstalk_eval::tests::wiki_rereads::the_live_detector_finds_every_first_read_and_no_reread",
    "crosstalk_eval::tests::wiki_rereads::a_second_read_of_the_same_lines_is_a_reread_control",
]

[evidence-review]
unit = { agent = "true", human = "false" }
