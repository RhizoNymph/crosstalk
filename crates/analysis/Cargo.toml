[package]
name = "crosstalk-analysis"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "L6 analysis for crosstalk: embeddings, topics, search, alert rules and triage, and projections."

[lints]
workspace = true

[dependencies]
crosstalk-spec = { path = "../../spec" }
crosstalk-store = { path = "../store" }
blake3.workspace = true
bytes.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["client", "http1"] }
hyper-rustls = { workspace = true, features = ["http1", "ring", "tls12", "webpki-tokio"] }
hyper-util = { workspace = true, features = ["client-legacy", "http1", "tokio"] }
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time"] }
tracing.workspace = true

[dev-dependencies]
crosstalk-memory = { path = "../memory" }
crosstalk-testkit = { path = "../testkit" }
crosstalk-transport = { path = "../transport" }
proptest.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "rt-multi-thread", "sync", "test-util", "time"] }
