[invariant]
id = "surface.action.merge-forwarded"
statement = "A MergeAgents action that returns Ok passes to IdentityResolver::merge a MergeRequest with the source and target the operator requested and MergeAuthor::Operator of the Caller's OperatorId, with the time the surface accepted the action."
kind = "domain"
property = "postcondition"
requires = ["unit"]
rationale = """
The surface does not perform merges; L3 owns identity and records the
MergeRecord with its author. Swapping source and target would alias the
wrong agent, and a request built with MergeAuthor::Resolver or another
operator would make an operator merge indistinguishable from an automatic
one or misattribute it.
"""

[evidence]
unit = "crosstalk_surface::tests::actions::merge_forwarded_with_caller_as_author"

[evidence-review]
unit = { agent = "true", human = "false" }
