# Infrastructure scrape config for the single-machine deployment. There is
# no Alertmanager: rules in rules/ fire into the Prometheus and Grafana UIs.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # node-exporter runs on the host network on 19100 (set in compose.yaml;
  # change both together).
  - job_name: node
    static_configs:
      - targets: ["host.docker.internal:19100"]
        labels:
          instance: host

  - job_name: cadvisor
    scrape_interval: 30s
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          instance: postgres

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]

  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]

  # The gateway's own metrics on its ops listener (docs/features/deploy.md).
  - job_name: crosstalk
    static_configs:
      - targets: ["crosstalk:9464"]
        labels:
          role: all
