[package]
name = "crosstalk-ui"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Operator web UI for crosstalk."

[lints]
workspace = true

[dependencies]
anyhow = "=1.0.104"
crosstalk-api = { path = "../crates/api" }
crosstalk-memory = { path = "../crates/memory" }
crosstalk-spec = { path = "../spec" }
crosstalk-surface = { path = "../crates/surface" }
crosstalk-transport = { path = "../crates/transport" }
crosstalk-world = { path = "../crates/world" }
futures-core = { version = "=0.3.34", default-features = false }
jiff = "=0.2.37"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.21"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
topcoat = { version = "=0.9.0", default-features = false, features = ["router", "runtime", "serve", "view", "discover", "asset", "sse", "tailwind"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "json"] }

[dev-dependencies]
crosstalk-conformance = { path = "../crates/conformance" }

[features]
# Hosts the gateway's whole composition (`"backend": {"live": ..}`); a stub
# until the gateway provides it.
live = []

[build-dependencies]
topcoat = { version = "=0.9.0", default-features = false, features = ["tailwind"] }
