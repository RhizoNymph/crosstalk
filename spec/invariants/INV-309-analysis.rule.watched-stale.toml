[invariant]
id = "analysis.rule.watched-stale"
statement = "When TopicVersionReady for a version is processed, a WatchedTopic rule current on its predecessor with any topic whose best link in the stored lineage is absent or below remap_threshold becomes TopicWatch::Stale, naming exactly those topics, and keeps its RuleStatus."
kind = "domain"
property = "postcondition"
requires = ["unit", "property"]
rationale = """
A topic that has no close counterpart in the new fit cannot be remapped
without guessing. Marking the whole rule stale makes the loss visible to
the operator instead of silently watching the wrong topics, or a subset of
the intended ones. Staleness is separate from the operator's enabled or
disabled status, which the remap leaves as it was
(analysis.rule.remap-via-lineage).
"""

[evidence]
unit = "crosstalk_analysis::alerts::tests::rules::watched_rule_with_unmappable_topic_becomes_stale"
property = "crosstalk_analysis::alerts::tests::model::rule_store_matches_the_reference"

[evidence-review]
unit = { agent = "false", human = "false" }
property = { agent = "true", human = "false" }
