[package]
name = "crosstalk-ingress"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "L0 ingress for crosstalk: the reverse and forward proxy, upstream routing, credential hashing, provider adapters, response framing and the SSE tee."

[lints]
workspace = true

[dependencies]
crosstalk-spec = { path = "../../spec" }
blake3.workspace = true
bytes.workspace = true
flate2.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["client", "http1", "server"] }
hyper-rustls = { workspace = true, features = ["http1", "ring", "tls12", "webpki-tokio"] }
hyper-util = { workspace = true, features = ["client-legacy", "http1", "tokio"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "sync", "time"] }
tracing.workspace = true
zstd.workspace = true

[dev-dependencies]
crosstalk-sim = { path = "../sim" }
crosstalk-testkit = { path = "../testkit" }
proptest.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
tower-service.workspace = true
tracing-subscriber = { workspace = true, features = ["fmt", "std"] }
