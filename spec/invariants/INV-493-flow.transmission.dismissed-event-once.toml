[invariant]
id = "flow.transmission.dismissed-event-once"
statement = "Each dismissal that returns Ok publishes exactly one TransmissionDismissed, and one that returns an error publishes none."
kind = "coordination"
requires = ["dst"]
rationale = """
Alert triage suppresses the SuspectedTransmission alert on this event. A
lost event leaves the alert open for a transmission the operator dismissed;
an event for a failed dismissal would suppress an alert about a
transmission that is still suspected or confirmed.
"""

[evidence]
dst = "crosstalk::flow::tests::dst_transmission_dismissed_once"

[evidence-review]
dst = { agent = "false", human = "false" }
