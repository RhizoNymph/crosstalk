[invariant]
id = "flow.registry.promote-rejects-without-effect"
statement = "ChannelRegistry::promote returns UnknownChannel, NotDiscovered, PatternMissesSeed or OverlappingDeclaration for an unknown channel, an already declared one, a pattern that does not match the channel's seed locator, or one overlapping another declared channel's pattern, and changes nothing."
kind = "domain"
property = "postcondition"
requires = ["unit", "integration"]
rationale = """
A pattern that misses the channel's own seed is almost certainly a typo and
would pull unrelated resources into it. An overlapping pattern would make
lookup ambiguous between two channels with different policies. Rejecting
without effect lets the operator correct the pattern and retry.
"""

[evidence]
unit = "crosstalk::flow::tests::promote_rejections_change_nothing"
integration = "crosstalk::flow::tests::pg_promote_rejections_change_nothing"

[evidence-review]
unit = { agent = "false", human = "false" }
integration = { agent = "false", human = "false" }
