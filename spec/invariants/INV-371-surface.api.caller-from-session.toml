[invariant]
id = "surface.api.caller-from-session"
statement = "Every Caller is built by OperatorDirectory::caller from the RequestIdentity of the HTTP request's verified session or token (in trusted mode, the trusted operator), never from request parameters, headers other than the session credential, or the body."
kind = "domain"
property = "postcondition"
requires = ["unit", "integration"]
rationale = """
Every permission check and every recorded author (audit entry, policy
decision, merge request, alert transition) trusts Caller. If any field
could come from the request itself, a View user could claim Govern or act
as another operator. Caller's fields are private and only the directory
builds one (surface.operators.caller-from-directory).
"""

[evidence]
unit = "crosstalk_surface::tests::caller_ignores_operator_in_request"
integration = "crosstalk_surface::integration::forged_operator_field_has_no_effect"

[evidence-review]
unit = { agent = "false", human = "false" }
integration = { agent = "false", human = "false" }
