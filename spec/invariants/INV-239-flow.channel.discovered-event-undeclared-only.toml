[invariant]
id = "flow.channel.discovered-event-undeclared-only"
statement = "ChannelDiscovered is published for an access only when the registry lookup for its locator returned New."
kind = "domain"
property = "postcondition"
requires = ["unit"]
rationale = """
ChannelDiscovered raises NewChannel. A declared channel is known by
definition, so alerting on its first use is noise, and a Known lookup is not
a first sighting.
"""

[evidence]
unit = "crosstalk::flow::channel::tests::declared_first_access_not_discovered"

[evidence-review]
unit = { agent = "false", human = "false" }
