[invariant]
id = "ingress.credential.every-scheme-hashed"
statement = "For every request that carries a credential, ClientIdentifier::credential returns a CredentialRef rather than None, whatever the credential's scheme."
kind = "domain"
property = "postcondition"
requires = ["unit"]
rationale = """
A credential the proxy fails to recognise leaves the exchange with no
identity scope at all, and L3 then has only weak signals to separate
agents. Every scheme the harnesses use (x-api-key, Bearer API keys, OAuth
access tokens, Copilot minted tokens, self-hosted server keys) must be
recognised and hashed. Which scheme is recorded is
ingress.credential.scheme-follows-documented-rule.
"""

[evidence]
unit = "crosstalk::ingress::tests::credential::every_scheme_yields_credential_ref"

[evidence-review]
unit = { agent = "false", human = "false" }
