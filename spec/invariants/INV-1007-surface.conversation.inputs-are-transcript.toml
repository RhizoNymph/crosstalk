[invariant]
id = "surface.conversation.inputs-are-transcript"
statement = "A turn's inputs, then its output, are exactly its exchange's transcript entries in ordinal order: the entries the conversation's transcript holds for that exchange, system ones included, each once."
kind = "domain"
property = "postcondition"
requires = ["unit", "integration"]
rationale = """
The turn view is the transcript cut by exchange; a view assembled from
the delta or the request instead would drop system turns or repeat a
fork's inherited messages.
"""

[evidence]
unit = [
    "crosstalk_reconstruct::tests::conversation_reads::turn_entries_are_the_exchanges_transcript_entries",
    "crosstalk_surface::tests::conversations::turn_messages_are_the_turn_entries",
]
integration = "crosstalk_reconstruct::tests::pg_conversation_reads::pg_turn_entries_are_the_exchanges_transcript_entries"

[evidence-review]
unit = { agent = "true", human = "false" }
integration = { agent = "false", human = "false" }
