[invariant]
id = "surface.projection.stale-layout"
statement = "QueryApi::projection with a request layout token other than the current layout's token returns StaleProjection carrying the current token and no points."
kind = "domain"
property = "postcondition"
requires = ["unit"]
rationale = """
A client extending a 50,000-point projection (a wider window, a relaxed
filter) merges the new points into what it holds. Points from a re-fitted
layout have unrelated coordinates, so merging them would scatter clusters
across the canvas. Rejecting the request with the current token tells the
client to reload instead, without sending points it must discard.
"""

[evidence]
unit = "crosstalk::surface::tests::projection_with_stale_layout_returns_current_token"

[evidence-review]
unit = { agent = "false", human = "false" }
