[invariant]
id = "surface.alert.action-change-announced"
statement = "An Acknowledge or Resolve that returns Applied publishes Changed::Alert for its alert at least once, and never before the new state is visible to QueryApi::alerts."
kind = "coordination"
requires = ["dst"]
rationale = """
The surface acknowledges and resolves through L6's alert store
(AlertActions), which owns the alert and so announces the change from the
transaction that makes it, as it does for triage; the surface publishes
nothing for it. Other operators' views of the alert update only through
this notification.
"""

[evidence]
dst = "crosstalk_surface::dst::acknowledge_announces_alert_change"

[evidence-review]
dst = { agent = "false", human = "false" }
