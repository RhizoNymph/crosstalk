[invariant]
id = "reconstruct.agent-renamed.once-per-change"
statement = "Each IdentityResolver::rename that returns Applied publishes exactly one AgentRenamed with the new label, and one that returns Unchanged or an error publishes none."
kind = "coordination"
requires = ["dst"]
rationale = """
The live feed turns AgentRenamed into the UI's agent change. A lost event
leaves other operators' views showing the old name; an event for an
unchanged or refused rename would flicker the UI and suggest a change that
did not happen.
"""

[evidence]
dst = "crosstalk::reconstruct::tests::dst_agent_renamed_once"

[evidence-review]
dst = { agent = "false", human = "false" }
