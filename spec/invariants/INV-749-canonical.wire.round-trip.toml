[invariant]
id = "canonical.wire.round-trip"
statement = "For every value v of a wire type, decoding the JSON that encoding v produces gives a value equal to v."
kind = "domain"
property = "postcondition"
requires = ["unit"]
rationale = """
The spec types are the wire format between the gateway, the operator UI
and other gateway nodes, so whatever one side sends the other must read
back unchanged: a lossy encoding (a timestamp truncated to milliseconds, a
digest re-cased, a cursor re-encoded) would make the UI show, or a node
apply, something other than what was stored. Every golden test checks both
directions, and timestamps are also checked across their whole range.
"""

