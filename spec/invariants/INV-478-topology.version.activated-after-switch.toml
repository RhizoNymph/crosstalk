[invariant]
id = "topology.version.activated-after-switch"
statement = "TopicVersionActivated for a version is published only after EdgeStore::activate has switched graph queries to that version, and never for a version older than the active one."
kind = "coordination"
requires = ["dst"]
rationale = """
The live feed forwards TopicVersionActivated so clients refetch the
topology. Published before the switch, a client would refetch and still
get the old version's graph, then never be told to refetch again.
"""

[evidence]
dst = "crosstalk::topology::dst::version_activated_published_after_switch"

[evidence-review]
dst = { agent = "false", human = "false" }
