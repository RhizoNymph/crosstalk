[invariant]
id = "surface.channels.listing-from-traffic"
statement = "A ChannelRow's listing and confirmation are derived from its channel's origin and its CrossTraffic (Channel(Confirmed) with a confirmed crossing transmission, Channel(Unconfirmed) with only unconfirmed ones, Declaration for a declared channel and Hidden for a discovered one with none, and no listing when superseded), and ChannelRow::new refuses cross-agent traffic on a channel whose stored detection has none."
kind = "representation"
requires = ["type", "unit"]
rationale = """
Whether a channel exists, and whether its traffic is confirmed, must
never disagree with the traffic: storing a flag beside the transmissions
would let a merge, an unmerge or a late confirmation leave it stale. The
row holds only the traffic counts, tallied at the read with merges
resolved, and derives the listing and the confirmation from them, so an
unconfirmed marker cannot sit on a channel with confirmed traffic and a
hidden channel cannot be listed. Merges only remove crossing transmissions
at read time, so traffic on a channel whose stored detection never saw
any is a store fault.
"""

[evidence]
type = [
    "crosstalk_spec::interfaces::l8_surface::channels::ChannelRow::new",
    "crosstalk_spec::derived::flow::channel::confirmation::Listing::of",
]
unit = [
    "crosstalk_spec::tests::confirmation::listing_follows_origin_and_traffic",
    "crosstalk_spec::tests::confirmation::confirmation_follows_the_counts",
    "crosstalk_spec::tests::confirmation::cross_traffic_counts_crossing_transmissions_by_confirmation",
    "crosstalk_spec::tests::confirmation::rows_refuse_traffic_their_detection_does_not_have",
]

[evidence-review]
type = { agent = "true", human = "false" }
unit = { agent = "true", human = "false" }
