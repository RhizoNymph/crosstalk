[invariant]
id = "provenance.match.carrier-from-part"
statement = "A ContentMatch's carrier is ToolResult(id) when read_at is in a tool result for call id, UserTurn when it is in a user message, SystemPrompt when it is in a system message, and ReaderOutput when it is in the reader's output."
kind = "domain"
property = "postcondition"
requires = ["unit"]
rationale = """
The carrier decides what a match means: a tool result implies a channel, a
user turn implies an orchestrator or human relay, a system prompt implies
configuration, and reader output implies a channel the gateway cannot see.
L5 routes on it, so a carrier inconsistent with read_at fabricates or hides
channels.
"""

[evidence]
unit = ["crosstalk::provenance::tests::carrier_for_tool_result", "crosstalk::provenance::tests::carrier_for_user_turn", "crosstalk::provenance::tests::carrier_for_system_prompt", "crosstalk::provenance::tests::carrier_for_reader_output"]

[evidence-review]
unit = { agent = "false", human = "false" }
