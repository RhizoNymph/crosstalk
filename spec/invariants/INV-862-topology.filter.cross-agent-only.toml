[invariant]
id = "topology.filter.cross-agent-only"
statement = "TopologyFilter::admits never admits a FilterSubject whose sender and reader are one agent, whatever the filter, so no linked view (graph, series, search, the projection's sample, the edge drill-down, exports) counts or lists a transmission whose agents have merged into one."
kind = "domain"
property = "invariant"
requires = ["unit"]
rationale = """
A transmission is communication between two agents. Graphs dropped a
merged pair as a self-edge, but search, projections and exports kept it,
so the same transmission counted in one view and not another. Putting the
rule in the one filter every view applies makes them agree, and an
unmerge brings the transmission back everywhere at the next read.
"""

[evidence]
unit = [
    "crosstalk_spec::tests::confirmation::no_filter_admits_a_transmission_within_one_agent",
]

[evidence-review]
unit = { agent = "true", human = "false" }
