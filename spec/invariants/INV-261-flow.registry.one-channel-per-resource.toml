[invariant]
id = "flow.registry.one-channel-per-resource"
statement = "Each ResourceId is stored on exactly one channel, and so resolves to exactly one canonical channel, even when two first accesses to the same undeclared resource are processed concurrently."
kind = "coordination"
requires = ["dst", "integration"]
rationale = """
Lookup followed by creating a discovered channel is a check-then-act. Two
consumers that both see `New` would create two channels for one resource,
putting the writer and the reader on different channels so the cross
access is never seen, and raising NewChannel twice. A promotion moves no
stored resource: a superseded channel's resources stay under its id and
resolve, in one step, to the channel that superseded it, so every reader
still sees one channel per resource.
"""

[evidence]
dst = "crosstalk_flow::dst::concurrent_first_access_one_channel"
integration = "crosstalk_flow::registry::integration::pg_concurrent_new_lookup"

[evidence-review]
dst = { agent = "false", human = "false" }
integration = { agent = "false", human = "false" }
