[invariant]
id = "surface.action.audit-recorded"
statement = "After an operator action returns Ok, the audit log holds an AuditEntry for it whose body is an OperatorRecord with the Caller, the action and AuditOutcome::Succeeded of the returned ActionOutcome, at the time the action was accepted."
kind = "domain"
property = "postcondition"
requires = ["unit", "integration"]
rationale = """
Policy changes and merges alter what the gateway reports from then on, so
an operator must be able to answer who sanctioned a channel or merged two
agents, and when. The entry is written in the same transaction as the
action's effect (outbox), so an action cannot succeed without its record.
Refused and forbidden calls are recorded too
(surface.audit.every-call-recorded).
"""

[evidence]
unit = "crosstalk::surface::tests::successful_actions_are_audited"
integration = "crosstalk::surface::integration::audit_record_committed_with_action"

[evidence-review]
unit = { agent = "false", human = "false" }
integration = { agent = "false", human = "false" }
