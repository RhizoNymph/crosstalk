[invariant]
id = "analysis.sizes.rejects-unready"
statement = "TopicCatalog::sizes returns StillFitting for a version whose status is Fitting and UnknownVersion for a version not in the history."
kind = "domain"
property = "postcondition"
requires = ["unit"]
rationale = """
A fitting version's assignments are incomplete, so its sizes would look
like a real, smaller topic distribution. Returning an error instead of
partial counts keeps the UI from charting them.
"""

[evidence]
unit = ["crosstalk::analysis::tests::sizes_of_fitting_version_rejected", "crosstalk::analysis::tests::sizes_of_unknown_version_rejected"]

[evidence-review]
unit = { agent = "false", human = "false" }
