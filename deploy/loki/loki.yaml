# Single-binary Loki on the local filesystem, keeping logs for 7 days.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: 2026-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

# The WAL refuses every write ("Ingester is shutting down") once the disk is
# fuller than disk_full_threshold (default 0.9). node0's disk is shared with
# other workloads and sits above 90%, so the default silently drops all logs;
# only refuse when the disk is nearly out.
ingester:
  wal:
    disk_full_threshold: 0.99

limits_config:
  retention_period: 168h
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

analytics:
  reporting_enabled: false
