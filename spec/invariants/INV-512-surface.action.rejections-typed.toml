[invariant]
id = "surface.action.rejections-typed"
statement = "An identity or rule action rejected by L3 or L6 returns NotFound for an unknown agent, merge record or rule; Conflict with AgentMerged, MergeAlreadyReverted, RuleNotEditable or TopicVersionNotCurrent; and InvalidInput with UnknownTopics, UnknownSink or QueryNotEmbeddable."
kind = "domain"
property = "postcondition"
requires = ["unit"]
rationale = """
The UI shows these to the operator. Collapsing them into a store error
would hide that a retry is pointless (already unmerged, a built-in rule) or
that the request needs changing (rename the canonical agent instead, pick
topics from the current version, choose a configured sink).
"""

[evidence]
unit = "crosstalk::surface::tests::layer_rejections_map_to_action_errors"

[evidence-review]
unit = { agent = "false", human = "false" }
