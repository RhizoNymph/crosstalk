[invariant]
id = "surface.overview.active-channels-match-rows"
statement = "For the same bucket-aligned window, the active_channels of QueryApi::overview under TopologyFilter::default() equals the number of rows of a full QueryApi::channels traversal under ChannelFilter::default() with that window whose transmissions count is non-zero, both read at one watermark."
kind = "domain"
property = "model-based"
requires = ["unit", "integration"]
rationale = """
The overview's "active channels" and the channel list must not tell an
operator different stories. Both count from the topology graph: the
overview takes EdgeTotals::of it, the rows take ChannelCounts::routed of it
under the default filter, and the keys of the second are exactly the
channels the first counts. The default channel filter lists every channel
in force and no superseded one, which carries no counts. A row's
ChannelActivity::Seen is wider (any access ever) and is not what active
means.
"""

[evidence]
unit = [
    "crosstalk_spec::tests::overview::active_channels_are_the_channels_rows_count_transmissions_on",
    "crosstalk_spec::tests::overview::rows_count_the_transmissions_the_graph_routes_through_each_channel",
]
integration = "crosstalk::surface::integration::pg_overview_active_channels_match_channel_rows"

[evidence-review]
unit = { agent = "true", human = "false" }
integration = { agent = "false", human = "false" }
