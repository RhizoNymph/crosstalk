[invariant]
id = "surface.channels.merge-hides-unmerge-restores"
statement = "When a merge leaves every transmission through a discovered channel within one agent, the next QueryApi::channels, channel_topology and overview leave the channel out while QueryApi::channel still returns its row with Listing::Hidden and policy_history its history, and unmerging that merge lists, draws and counts it again as before the merge."
kind = "domain"
property = "metamorphic"
requires = ["unit", "integration"]
rationale = """
Merges are aliases resolved at read time and an unmerge reverts one
exactly, so what a merge hides an unmerge must bring back. Deleting the
channel, or marking it at merge time, would lose its policy history and
its record and could not be undone; hiding it at read time keeps both and
needs nothing rewritten.
"""

[evidence]
unit = [
    "crosstalk_spec::tests::confirmation::a_merge_hides_a_discovered_channel_and_an_unmerge_lists_it_again",
    "crosstalk_memory::flow::registry::tests::traffic::a_merge_hides_a_discovered_channel_and_an_unmerge_lists_it_again",
]
integration = "crosstalk_surface::integration::pg_merge_hides_channel"

[evidence-review]
unit = { agent = "true", human = "false" }
integration = { agent = "false", human = "false" }
