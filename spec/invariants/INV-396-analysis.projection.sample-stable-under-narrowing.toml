[invariant]
id = "analysis.projection.sample-stable-under-narrowing"
statement = "Under one projection token, a point returned for a window and filter is also returned for any sub-window containing its confirmed_at and any narrower filter that admits it."
kind = "domain"
property = "metamorphic"
requires = ["property"]
rationale = """
When more transmissions match than the limit, the projection keeps those
with the smallest sample key (a keyed hash of the transmission id). Bottom-k
selection has this property; a random or most-recent sample would make
points vanish and reappear as the operator narrows a linked view, which
reads as data changing.
"""

[evidence]
property = "crosstalk::analysis::tests::prop_projection_sample_survives_narrowing"

[evidence-review]
property = { agent = "false", human = "false" }
