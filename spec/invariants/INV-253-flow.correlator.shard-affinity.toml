[invariant]
id = "flow.correlator.shard-affinity"
statement = "Every access on a channel and every content match carried by a tool result from that channel are handled by the correlator shard of the channel's canonical channel, so evidence recorded on a channel before a promotion superseded it and evidence recorded after meet on one shard."
kind = "coordination"
requires = ["dst"]
rationale = """
A correlator runs in one task per shard and sees only its own evidence. If
a channel's write, read and content match landed on different shards, none
would see enough to open or confirm the transmission. Sharding by channel
keeps all evidence for one transmission together. A promotion changes
which channel a resource's accesses are recorded on: lookups never return
a superseded channel, so a write recorded on a discovered channel before
the promotion absorbed it and a read recorded on the promoted channel
after it belong to one medium. Keying the shard by the canonical channel,
with the evidence a shard holds for a superseded channel handed to the
promoted channel's shard when ChannelPromoted is processed, keeps that
pair correlatable.
"""

[evidence]
dst = "crosstalk::flow::dst::channel_evidence_reaches_one_shard"

[evidence-review]
dst = { agent = "false", human = "false" }
