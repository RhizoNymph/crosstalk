[invariant]
id = "surface.action.rejections-typed"
statement = "An operator action rejected by L3, L5 or L6 returns NotFound for an unknown agent, channel, transmission or rule, and BadRequest naming the reason for NotMerged, NotDiscovered, PatternMissesSeed, OverlappingDeclaration, NotSuspected, KindChanged, NotCurrentVersion, UnknownTopic and DuplicateId."
kind = "domain"
property = "postcondition"
requires = ["unit"]
rationale = """
The UI shows these to the operator. Collapsing them into a store error
would hide that a retry is pointless (already unmerged, no longer
suspected) or that the request needs changing (overlapping pattern, stale
topic version).
"""

[evidence]
unit = "crosstalk::surface::tests::layer_rejections_map_to_query_errors"

[evidence-review]
unit = { agent = "false", human = "false" }
