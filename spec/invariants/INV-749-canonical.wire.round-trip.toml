[invariant]
id = "canonical.wire.round-trip"
statement = "For every value v of a wire type, decoding the JSON that encoding v produces gives a value equal to v."
kind = "domain"
property = "postcondition"
requires = ["unit"]
rationale = """
The spec types are the wire format between the gateway, the operator UI
and other gateway nodes, so whatever one side sends the other must read
back unchanged: a lossy encoding (a timestamp truncated to milliseconds, a
digest re-cased, a cursor re-encoded) would make the UI show, or a node
apply, something other than what was stored. Every golden test checks both
directions, and timestamps are also checked across their whole range.
"""

[evidence]
unit = [
    "crosstalk_spec::tests::wire::alerts::alerts_golden_in_every_state",
    "crosstalk_spec::tests::wire::alerts::alert_list_request_and_response_golden",
    "crosstalk_spec::tests::wire::alerts::single_alert_response_golden",
    "crosstalk_spec::tests::wire::errors::errors_golden_with_every_variant",
    "crosstalk_spec::tests::wire::paging::paging_goldens",
    "crosstalk_spec::tests::wire::paging::pages_round_trip_through_goldens",
    "crosstalk_spec::tests::wire::support::support_goldens",
    "crosstalk_spec::tests::wire::ids::ids_key_maps_by_their_text",
    "crosstalk_spec::tests::wire::time::timestamps_round_trip_across_the_range",
    "crosstalk_spec::tests::wire::surface_actions::actions::every_action_request_golden",
    "crosstalk_spec::tests::wire::surface_actions::actions::every_operator_action_golden",
    "crosstalk_spec::tests::wire::surface_actions::actions::action_outcomes_golden_with_every_variant",
    "crosstalk_spec::tests::wire::surface_actions::audit::audit_entries_golden_for_every_body",
    "crosstalk_spec::tests::wire::surface_actions::audit::operator_records_golden_for_every_action",
    "crosstalk_spec::tests::wire::surface_actions::audit::audit_list_request_and_response_golden",
    "crosstalk_spec::tests::wire::surface_actions::live::live_items_golden_with_every_variant",
    "crosstalk_spec::tests::wire::surface_actions::live::cursor_reasons_ends_and_resumes_golden",
    "crosstalk_spec::tests::wire::surface_actions::lists::sinks_golden_with_every_delivery_form",
    "crosstalk_spec::tests::wire::surface_actions::lists::topic_page_golden",
    "crosstalk_spec::tests::wire::surface_actions::operators::permission_sets_golden",
]

[evidence-review]
unit = { agent = "true", human = "false" }
