[invariant]
id = "surface.live.scope-keys"
statement = "The feed writer gives each feed entry the ScopeKeys documented on ScopeKeys for its update kind, and a stream matches agents after resolving both the keys and the filter through the AgentDirectory and counts a topic only under the topic-model version the stream started with."
kind = "domain"
property = "postcondition"
requires = ["unit"]
rationale = """
admitted_by is only as good as the keys it is given. Keys taken from the
event alone would miss a transmission alert's agents and route, and raw
agent ids would miss a filter naming the canonical agent after a merge. A
topic id from another topic-model version names a different topic, so
matching it would show unrelated updates.
"""

[evidence]
unit = ["crosstalk::surface::tests::feed_entry_scope_keys_per_kind", "crosstalk::surface::tests::live_filter_resolves_merged_agents", "crosstalk::surface::tests::live_topic_key_only_under_stream_version"]

[evidence-review]
unit = { agent = "false", human = "false" }
