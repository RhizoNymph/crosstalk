[invariant]
id = "analysis.rule.new-channel-on-discovery"
statement = "The NewChannel rule raises a draft only from a ChannelDiscovered event, with the discovered channel as subject, so it fires at most once per discovered channel and never for a resource without a cross-agent transmission."
kind = "domain"
property = "postcondition"
requires = ["unit"]
rationale = """
NewChannel tells an operator that agents started communicating through
something nobody declared. Raising it on a first access alerted on every
resource any agent touched; raising it on discovery alerts exactly when a
transmission between two agents first goes through a resource on no
channel.
"""

[evidence]
unit = "crosstalk::analysis::rules::tests::new_channel_only_on_discovery"

[evidence-review]
unit = { agent = "false", human = "false" }
