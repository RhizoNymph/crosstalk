[invariant]
id = "flow.channel.resource-only-until-cross-agent"
statement = "Accesses to a resource on no channel that matches no declared pattern, whether by one agent alone or by writers no other agent reads after, create no channel, publish no ChannelDiscovered, raise no NewChannel and are recorded with AccessRecorded carrying no channel."
kind = "domain"
property = "invariant"
requires = ["unit", "dst"]
rationale = """
A resource only one agent uses, such as a scratch key-value entry, is not
a medium between agents, and listing it as a channel made the channel list
and the graph claim communication that never happened. Its accesses are
still recorded on the resource (and count on a channel at read time if one
is discovered from it later), so nothing observed is lost.
"""

[evidence]
unit = "crosstalk::flow::channel::tests::single_agent_resource_stays_a_resource"
dst = "crosstalk::flow::dst::writes_without_cross_reads_create_no_channel"

[evidence-review]
unit = { agent = "false", human = "false" }
dst = { agent = "false", human = "false" }
