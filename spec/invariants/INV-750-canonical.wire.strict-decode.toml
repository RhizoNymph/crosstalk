[invariant]
id = "canonical.wire.strict-decode"
statement = "Decoding a wire type refuses JSON that has a field or a variant the type does not declare."
kind = "domain"
property = "postcondition"
requires = ["unit"]
rationale = """
In cluster mode, nodes of different versions exchange bus events over
NATS. A lenient decoder would drop a field a newer node added, or a
variant it does not know, and act on a partial value; a strict one fails
the delivery, which dead-letters it where an operator sees it. For client
requests, strictness turns a misspelt filter field or a smuggled author
into an error instead of a silently ignored key. Every struct and tagged
enum sets deny_unknown_fields. Two alternate spellings serde still accepts
are not unknown fields or variants: a unit variant written with
"data": null, and a string enum written as {"variant": null}; the goldens
pin the canonical forms.
"""

