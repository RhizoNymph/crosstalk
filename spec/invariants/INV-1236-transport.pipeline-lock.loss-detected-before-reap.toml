[invariant]
id = "transport.pipeline-lock.loss-detected-before-reap"
statement = "A pipeline process whose lock session goes silent (a network partition answering nothing and resetting nothing) reports pipeline_lock lost and abandons its pipeline incarnation within a bound fixed at compile time (the lock's ping interval plus its ping deadline, then the reachability probe and the abandon) that is strictly shorter than the server's reap of a partitioned session (about 25 s with deploy's tcp_keepalives idle 10, interval 5, count 3 and tcp_user_timeout 25000)."
kind = "performance"
requires = ["unit", "integration"]
rationale = """
The server releases a partitioned session's advisory lock once it reaps
the session; from then on another process may take the lock. A holder
that has not noticed by then runs a second pipeline on the same database:
two writers of the correlator's checkpoint, and a bus that hands back
deliveries a live process still holds. Before the ping had a deadline a
silent partition hung it until TCP gave up or the link healed; on the
node0 bench (20261012T180130Z) the gateway reported pipeline_lock held
for about 33 s after the server had reaped its session. The holder now
times each ping out after PING_TIMEOUT, and compile-time assertions keep
PING + PING_TIMEOUT (store::lock::DETECTION), and that plus the probe and
the abandon (gateway::postgres::LOST_SHUTDOWN, 1 s: every task aborted and
joined, nothing drained), below store::lock::SERVER_REAP. Lengthening the
ping or its deadline, or shortening the server's keepalives, must keep the
order.
"""

[evidence]
unit = "crosstalk_gateway::store::lock::tests::detection_is_one_ping_and_its_deadline"
integration = [
    "crosstalk_gateway::integration::lock::pg_a_silently_partitioned_lock_session_is_lost_within_the_bound",
    "crosstalk_gateway::integration::lock::pg_a_running_pipeline_reports_its_partitioned_lock_lost_within_the_bound",
]

[evidence-review]
unit = { agent = "true", human = "false" }
integration = { agent = "true", human = "false" }
