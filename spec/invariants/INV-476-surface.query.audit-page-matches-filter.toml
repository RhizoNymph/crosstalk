[invariant]
id = "surface.query.audit-page-matches-filter"
statement = "QueryApi::audit returns the stored records AuditFilter::matches admits, newest first by time and id, at most the smaller of the query's limit and MAX_AUDIT_PAGE per page, and following next from the first page returns every matching record exactly once."
kind = "domain"
property = "model-based"
requires = ["unit", "property"]
rationale = """
An audit query that drops a matching record hides an action; one that
repeats or skips records across pages makes counts wrong. Paging by the
last record's id rather than an offset keeps pages stable while new
records are appended at the head.
"""

[evidence]
unit = ["crosstalk_spec::tests::audit::audit_filter_combines_fields_with_and", "crosstalk::surface::tests::audit_pages_newest_first_without_gaps"]
property = "crosstalk::surface::tests::prop_audit_pages_match_filter_model"

[evidence-review]
unit = { agent = "false", human = "false" }
property = { agent = "false", human = "false" }
