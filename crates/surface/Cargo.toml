[package]
name = "crosstalk-surface"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "L8 surface for crosstalk: the query API, operator actions, the live feed and export, generic over the spec's store traits."

[lints]
workspace = true

[dependencies]
crosstalk-spec = { path = "../../spec" }
crosstalk-store = { path = "../store" }
blake3.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tracing.workspace = true

[dev-dependencies]
crosstalk-memory = { path = "../memory" }
crosstalk-sim = { path = "../sim" }
crosstalk-testkit = { path = "../testkit" }
crosstalk-transport = { path = "../transport" }
proptest.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
