[invariant]
id = "topology.access.apply-idempotent"
statement = "EdgeStore::apply_access counts each AccessId into its bucket at most once, however many times its AccessRecorded is delivered."
kind = "coordination"
requires = ["unit", "integration"]
rationale = """
Bus delivery is at least once. Counting a redelivered access twice would
inflate write counts on exactly the channels an operator is watching for
unusual writes.
"""

[evidence]
unit = "crosstalk_topology::tests::apply_access_twice_counts_once"
integration = "crosstalk_topology::tests::pg_apply_access_idempotent"

[evidence-review]
unit = { agent = "true", human = "false" }
integration = { agent = "true", human = "false" }
