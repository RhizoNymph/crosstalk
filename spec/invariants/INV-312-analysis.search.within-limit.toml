[invariant]
id = "analysis.search.within-limit"
statement = "A search page holds at most its PageRequest's PageSize hits."
kind = "domain"
property = "postcondition"
requires = ["unit", "integration"]
rationale = """
The page size bounds response size and the cost of fetching snippets.
Hybrid search merges a full-text and a vector candidate list, each of
which may return up to the page size, so the merged list must be cut again
after fusion, before the page's cursor is taken from its last hit.
"""

[evidence]
unit = "crosstalk_analysis::search::tests::cases::hybrid_fusion_truncates_to_limit"
integration = "crosstalk_analysis::search::tests::cases::pg_hybrid_search_respects_limit"

[evidence-review]
unit = { agent = "false", human = "false" }
integration = { agent = "false", human = "false" }
