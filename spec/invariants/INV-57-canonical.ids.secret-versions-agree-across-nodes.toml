[invariant]
id = "canonical.ids.secret-versions-agree-across-nodes"
statement = "A node hashes credentials only while its loaded SecretVersions, their secrets and its current version match those of every other node in the deployment."
kind = "coordination"
requires = ["dst", "integration"]
rationale = """
Digests from different proxy nodes are compared as identity evidence. A
node with a missing, stale or different secret would mint digests that
match nothing, silently splitting every agent it serves into a new one. Each
node publishes a keyed fingerprint of a fixed probe per version at startup
and on reload, and refuses to hash while it disagrees with the deployment.
The simulation rolls a rotation across nodes with delayed and failed
reloads; the integration test runs nodes against the real bus.
"""

[evidence]
dst = "crosstalk::canonical::tests::dst_rotation_never_mixes_key_sets"
integration = "crosstalk::canonical::tests::mismatched_node_refuses_to_hash"

[evidence-review]
dst = { agent = "false", human = "false" }
integration = { agent = "false", human = "false" }
