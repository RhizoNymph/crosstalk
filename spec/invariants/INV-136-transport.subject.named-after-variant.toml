[invariant]
id = "transport.subject.named-after-variant"
statement = "BusEvent::subject returns the Subject variant with the same name as the event's innermost variant."
kind = "domain"
property = "postcondition"
requires = ["unit"]
rationale = """
Makes the mapping injective (no two event variants share a subject, so a
subscriber never receives an event family it did not ask for) and onto (no
subject nobody publishes). sample_events builds one event of each of the 18
variants; subjects_name_their_variant checks each maps to the same-named
Subject, and each_variant_has_its_own_subject checks the 18 subjects are
distinct.
"""

[evidence]
unit = ["crosstalk_spec::tests::events::subjects_name_their_variant", "crosstalk_spec::tests::events::each_variant_has_its_own_subject"]

[evidence-review]
unit = { agent = "true", human = "false" }
