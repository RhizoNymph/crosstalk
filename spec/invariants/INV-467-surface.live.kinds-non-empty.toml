[invariant]
id = "surface.live.kinds-non-empty"
statement = "Every UpdateKinds holds at least one LiveUpdateKind."
kind = "representation"
requires = ["type", "unit"]
rationale = """
A subscription to nothing would hold a connection open to send only
heartbeats; it is almost always a client bug, so it is rejected at
construction rather than served.
"""

[evidence]
type = "crosstalk_spec::interfaces::l8_surface::live::UpdateKinds::new"
unit = ["crosstalk_spec::tests::live::update_kinds_reject_empty", "crosstalk_spec::tests::live::update_kinds_hold_what_was_asked"]

[evidence-review]
type = { agent = "true", human = "false" }
unit = { agent = "true", human = "false" }
