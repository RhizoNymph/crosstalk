[invariant]
id = "surface.filter.views-agree"
statement = "For each of QueryApi::series, a full search traversal, a full edge_transmissions traversal and fit_projection, when both calls are computed under the same topic-model version, the transmissions counted, returned or sampled under a TopologyFilter are exactly those counted, returned or sampled under the default filter whose FilterSubject TopologyFilter::admits, where a projection is compared by its admitted set before sampling."
kind = "domain"
property = "metamorphic"
requires = ["property"]
rationale = """
The graph, series, search, UMAP and edge drill-down are linked views: a
selection in one must narrow the others to the same transmissions, or a
point highlighted in the UMAP has no edge in the graph and a search shows
hits the graph excludes. TopologyFilter::admits is the single definition
(agents on either end after alias resolution, channels only on channel
routes, route kinds, topics under the resolved version with outliers never
matching, false detections); topology.filter.* pins the graph to it.
Comparing each view with its own unfiltered result catches a view that
interprets a field differently, such as matching agents before alias
resolution. Projections are compared before sampling, since the sample
size cuts both results.
"""

[evidence]
property = "crosstalk_surface::tests::prop_filtered_views_equal_unfiltered_then_admits"

[evidence-review]
property = { agent = "false", human = "false" }
