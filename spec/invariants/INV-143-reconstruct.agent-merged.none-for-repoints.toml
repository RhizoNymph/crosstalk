[invariant]
id = "reconstruct.agent-merged.none-for-repoints"
statement = "Applying a merge publishes no AgentMerged event for the agents it repoints."
kind = "domain"
property = "postcondition"
requires = ["unit"]
rationale = """
Repointing agents already merged into the source is bookkeeping that keeps
chains flat. The merge's one AgentMerged lists them in `repointed`, so a
cache of the merge table updates them with it; an event per repointed
agent would announce merges no resolver or operator made, and could
trigger merge alerts for them.
"""

[evidence]
unit = "crosstalk_reconstruct::tests::repointed_agents_publish_no_agent_merged"

[evidence-review]
unit = { agent = "false", human = "false" }
