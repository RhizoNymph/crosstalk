[invariant]
id = "canonical.wire.strict-decode"
statement = "Decoding a wire type refuses JSON that has a field or a variant the type does not declare."
kind = "domain"
property = "postcondition"
requires = ["unit"]
rationale = """
In cluster mode, nodes of different versions exchange bus events over
NATS. A lenient decoder would drop a field a newer node added, or a
variant it does not know, and act on a partial value; a strict one fails
the delivery, which dead-letters it where an operator sees it. For client
requests, strictness turns a misspelt filter field or a smuggled author
into an error instead of a silently ignored key. Every struct and tagged
enum sets deny_unknown_fields. Two alternate spellings serde still accepts
are not unknown fields or variants: a unit variant written with
"data": null, and a string enum written as {"variant": null}; the goldens
pin the canonical forms.
"""

[evidence]
unit = [
    "crosstalk_spec::tests::wire::alerts::alerts_refuse_unknown_fields_and_variants",
    "crosstalk_spec::tests::wire::alerts::alert_filters_refuse_unknown_fields_and_kinds",
    "crosstalk_spec::tests::wire::errors::errors_refuse_unknown_variants_and_fields",
    "crosstalk_spec::tests::wire::paging::page_requests_refuse_unknown_fields",
    "crosstalk_spec::tests::wire::ids::secret_digests_reject_unknown_and_missing_fields",
    "crosstalk_spec::tests::wire::support::fieldless_enums_are_strings",
    "crosstalk_spec::tests::wire::support::watermarked_refuses_unknown_fields",
    "crosstalk_spec::tests::wire::surface_actions::actions::action_requests_refuse_stamps_unknown_fields_and_variants",
    "crosstalk_spec::tests::wire::surface_actions::actions::superseded_channels_decode_sorted_and_once",
    "crosstalk_spec::tests::wire::surface_actions::audit::audit_entries_refuse_unknown_fields_and_variants",
    "crosstalk_spec::tests::wire::surface_actions::audit::audit_filters_refuse_unknown_fields",
    "crosstalk_spec::tests::wire::surface_actions::audit::caller_snapshots_refuse_no_permissions_and_unknown_fields",
    "crosstalk_spec::tests::wire::surface_actions::live::live_items_refuse_unknown_fields_and_variants",
    "crosstalk_spec::tests::wire::surface_actions::lists::list_requests_refuse_unknown_fields_and_variants",
    "crosstalk_spec::tests::wire::surface_actions::lists::reports_refuse_unknown_fields_and_other_delivery_forms",
    "crosstalk_spec::tests::wire::surface_actions::operators::operators_refuse_unknown_fields_and_modes",
]

