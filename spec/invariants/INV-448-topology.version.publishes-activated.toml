[invariant]
id = "topology.version.publishes-activated"
statement = "The edge store publishes TopicVersionActivated for a version, naming the version queries read before as previous, exactly once per switch, from the transaction in which EdgeStore::activate switches graph and series queries to it (activate then returns Switched), and never for a version older than the active one."
kind = "coordination"
requires = ["dst"]
rationale = """
The topic catalog marks a version Active, and every older one Superseded,
from this event, and the live feed forwards it so clients refetch the
topology. Publishing before the switch would let the UI's version list
call a version active while graphs still read the previous one, and a
client refetching on the event would get the old graph and never be told
to refetch again; not publishing would leave the version Ready forever.
"""

[evidence]
dst = ["crosstalk_topology::dst::activated_published_once_after_switch", "crosstalk_topology::dst::version_activated_published_after_switch"]

[evidence-review]
dst = { agent = "false", human = "false" }
