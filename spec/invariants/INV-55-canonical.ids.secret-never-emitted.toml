[invariant]
id = "canonical.ids.secret-never-emitted"
statement = "No deployment secret value appears in any log line, event, blob or stored row."
kind = "confidentiality"
requires = ["type", "lint"]
rationale = """
Anyone holding a secret can confirm guessed credentials against stored
digests, which undoes the keying. The secret lives only in a key type whose
Debug and Display print the version alone and which implements no
serialization, so it cannot be logged or encoded by accident. Its key has
no accessor at all: only the keyed hasher, in the same module, reads it.
The lint remains to keep a future accessor or a copy of the key bytes out
of every other module.
"""

[evidence]
type = "crosstalk_spec::ids::DeploymentSecret"
lint = "lint:deployment-secret-bytes-only-in-keyed-hasher"

[evidence-review]
type = { agent = "true", human = "false" }
lint = { agent = "false", human = "false" }
