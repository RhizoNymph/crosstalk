[invariant]
id = "surface.live.no-unqueryable-data"
statement = "Every item a live stream delivers is a Resync, a Heartbeat, or an update of a requested kind that the subscription's TopologyFilter admits and that holds only data the Caller could read through QueryApi with its permissions at delivery time."
kind = "confidentiality"
requires = ["property"]
rationale = """
Checking permissions per kind at subscribe time is not enough: a feed
writer that enriched an update (a channel change with the transmission's
agents and text, an alert with a snippet) would leak through a View-level
kind. The updates are designed to carry only query-visible data:
ChannelChange::TrafficConfirmed carries what QueryApi::channel shows as
the channel's last transmission, and alerts carry no content. The property
test seeds the blob store with marker strings and checks that no item on a
View-only stream contains them, and that every delivered update's kind was
requested and its scope admitted.
"""

[evidence]
property = "crosstalk::surface::tests::prop_live_items_queryable_by_caller"

[evidence-review]
property = { agent = "false", human = "false" }
