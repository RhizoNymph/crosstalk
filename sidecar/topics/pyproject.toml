[project]
name = "crosstalk-topics"
version = "0.1.0"
description = "Topic modeling (UMAP, HDBSCAN, c-TF-IDF) and UMAP layouts for crosstalk, over HTTP."
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi==0.141.1",
    "llvmlite==0.49.0",
    "numba==0.67.0",
    "numpy==2.5.3",
    "pydantic==2.13.5",
    "pynndescent==0.6.0",
    "scikit-learn==1.9.1",
    "scipy==1.18.1",
    "starlette==1.7.0",
    "umap-learn==0.5.12",
    "uvicorn==0.54.0",
]

[project.scripts]
crosstalk-topics = "crosstalk_topics.__main__:main"

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
    "ruff==0.16.9",
    "ty==0.0.84",
]

[build-system]
requires = ["uv_build==0.12.19"]
build-backend = "uv_build"

[tool.uv]
exclude-newer = "2026-09-27T00:00:00Z"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# starlette 1.7 suggests httpx2 for its TestClient; httpx 0.28 still works.
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "BLE"]
