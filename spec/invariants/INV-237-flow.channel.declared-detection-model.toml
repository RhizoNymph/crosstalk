[invariant]
id = "flow.channel.declared-detection-model"
statement = "Every transition the flow consumer applies to a DeclaredDetection is AwaitingTraffic to Unused on the idle timeout, or AwaitingTraffic or Unused to InUse(Observed) on an access."
kind = "domain"
property = "invariant"
requires = ["property"]
rationale = """
These are the transitions documented in `channel/detection.rs`. InUse
never returns to AwaitingTraffic or Unused: a channel that fell back to
Unused after traffic would publish a false DeclaredChannelUnused.
"""

[evidence]
property = "crosstalk_flow::channel::tests::declared_detection_transitions"

[evidence-review]
property = { agent = "false", human = "false" }
