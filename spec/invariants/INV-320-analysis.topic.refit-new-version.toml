[invariant]
id = "analysis.topic.refit-new-version"
statement = "A successful TopicModel::fit returns a TopicModelVersion strictly greater than the model's current version()."
kind = "domain"
property = "postcondition"
requires = ["unit"]
rationale = """
Versions identify which topic ids an assignment may reference. Reusing or
going back to an earlier version number would let assignments from two
different fits be read as one, and would break 'the highest version is the
newest' ordering that the switch-over relies on.
"""

[evidence]
unit = ["crosstalk::analysis::tests::fit_returns_version_above_current", "crosstalk::analysis::tests::first_fit_returns_version_above_unfitted"]

[evidence-review]
unit = { agent = "false", human = "false" }
