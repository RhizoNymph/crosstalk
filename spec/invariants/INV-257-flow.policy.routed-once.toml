[invariant]
id = "flow.policy.routed-once"
statement = "Every confirmed transmission with a Channel route is routed through channel policy exactly once, under the policy flow.policy.policy-at-confirmation picks."
kind = "coordination"
requires = ["dst"]
rationale = """
Policy routing is where confirmed traffic becomes an alert or is dropped.
Missing it lets unsanctioned traffic through silently; routing it twice (on
redelivery or restart) raises its alert twice. Delegation, Direct and
Unobserved transmissions have no channel and are not policy-routed.
"""

[evidence]
dst = "crosstalk::flow::dst::confirmed_routed_once"

[evidence-review]
dst = { agent = "false", human = "false" }
