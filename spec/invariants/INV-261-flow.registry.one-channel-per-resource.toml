[invariant]
id = "flow.registry.one-channel-per-resource"
statement = "Each ResourceId belongs to exactly one channel, even when two first accesses to the same undeclared resource are processed concurrently."
kind = "coordination"
requires = ["dst", "integration"]
rationale = """
Lookup followed by creating a discovered channel is a check-then-act. Two
consumers that both see `New` would create two channels for one resource,
putting the writer and the reader on different channels so the cross access
is never seen, and raising NewChannel twice.
"""

[evidence]
dst = "crosstalk::flow::dst::concurrent_first_access_one_channel"
integration = "crosstalk::flow::registry::integration::pg_concurrent_new_lookup"

[evidence-review]
dst = { agent = "false", human = "false" }
integration = { agent = "false", human = "false" }
