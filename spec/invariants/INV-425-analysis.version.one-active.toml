[invariant]
id = "analysis.version.one-active"
statement = "Every TopicVersionHistory has exactly one Active version."
kind = "representation"
requires = ["type", "unit"]
rationale = """
Graph and series queries read one version's buckets at a time
(topology.version.single-version), and QueryApi::topic_sizes resolves a
missing version to the active one. Zero or two active versions would make
both ambiguous. TopicVersionHistory::new returns NoActive or SeveralActive
otherwise.
"""

[evidence]
type = "crosstalk_spec::aggregates::topic_history::TopicVersionHistory::new"
unit = "crosstalk_spec::tests::topic_history::history_has_exactly_one_active"

[evidence-review]
type = { agent = "true", human = "false" }
unit = { agent = "true", human = "false" }
