[invariant]
id = "flow.traffic.discover-only-new"
statement = "ChannelTraffic::discover creates a channel only for a resource that is not stored and whose ChannelRegistry::lookup is New, refusing anything else with a TrafficError and changing nothing; add_resource stores a resource only on the channel its lookup names (or any channel in force when it is New) and never on a superseded channel."
kind = "domain"
property = "postcondition"
requires = ["unit", "property"]
rationale = """
The registry, not the flow consumer, enforces one channel per resource and
the lookup precedence on its write side, so a racing or redelivered
discovery cannot create a second channel for a locator a declared or
discovered channel already claims, and a superseded channel (whose
detection and resources are frozen) never grows. The property evidence is
the registry harness run against the reference.
"""

[evidence]
unit = "crosstalk_flow::registry::tests::discover_refuses_a_claimed_locator"
property = "crosstalk_flow::registry::tests::registry_agrees_with_reference_model"

[evidence-review]
unit = { agent = "false", human = "false" }
property = { agent = "false", human = "false" }
