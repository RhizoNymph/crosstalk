[package]
name = "crosstalk-api"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "The HTTP and SSE server for the crosstalk L8 surface."

[lints]
workspace = true

[dependencies]
crosstalk-spec = { path = "../../spec" }
axum = { workspace = true, features = ["http1", "tokio", "tracing"] }
bytes.workspace = true
form_urlencoded.workspace = true
futures-util = { workspace = true, features = ["std"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "sync"] }
tracing.workspace = true

[dev-dependencies]
http-body-util.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tower = { workspace = true, features = ["util"] }
