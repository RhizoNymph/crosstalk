[invariant]
id = "reconstruct.resolve.secret-rotation-keeps-agent"
statement = "When the deployment secret rotates and an agent sends an exchange during the overlap period, its exchanges after the overlap ends resolve to the same agent as before the rotation."
kind = "coordination"
requires = ["dst"]
rationale = """
Credential and account digests, and the scopes built from them, carry the
SecretVersion that keyed them, so the same key or account yields different
evidence under the new version. The overlap, in which the proxy computes
both digests, is the only window in which resolution can link old evidence
to new; if it does not attach the new-version evidence then, every agent
splits in two when the old version is unloaded.
"""

[evidence]
dst = "crosstalk_reconstruct::tests::dst::dst_secret_rotation_keeps_agent"

[evidence-review]
dst = { agent = "true", human = "false" }
