[invariant]
id = "topology.graph.stats-monotone"
statement = "For a fixed window, weighting and filter, when no agent merge and no topic-version activation falls between two graph queries, every edge of the earlier result appears in the later result with stats at least as large."
kind = "coordination"
requires = ["integration"]
rationale = """
Edge stats only grow as transmissions arrive; nothing in L7 subtracts.
Observed through queries, this can still break in the Timescale store: a
refresh that rewrites a materialized bucket from an incomplete source, or a
real-time union that double counts and then corrects, makes edges shrink or
flicker between queries. Operators read a falling count as communication
that was undone. Two events legitimately change edges and are excluded: a
merge re-keys edges onto the canonical agent (summing some, dropping those
that become self-edges), and an activation switches to another version's
buckets, under which a topic filter can match different transmissions.
"""

[evidence]
integration = "crosstalk::topology::integration::timescale_graph_stats_never_decrease_across_refresh"

[evidence-review]
integration = { agent = "false", human = "false" }
