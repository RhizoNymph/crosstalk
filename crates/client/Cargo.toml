[package]
name = "crosstalk-client"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "The HTTP client for the crosstalk L8 surface, used by the operator UI."

[lints]
workspace = true

[dependencies]
crosstalk-spec = { path = "../../spec" }
blake3.workspace = true
bytes.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["client", "http1"] }
hyper-util = { workspace = true, features = ["client-legacy", "http1", "tokio"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
tracing.workspace = true

[dev-dependencies]
crosstalk-api = { path = "../api", features = ["world"] }
crosstalk-conformance = { path = "../conformance" }
crosstalk-world = { path = "../world" }
http-body-util = { workspace = true, features = ["channel"] }
hyper = { workspace = true, features = ["client", "http1", "server"] }
hyper-util = { workspace = true, features = ["client-legacy", "http1", "tokio"] }
tokio = { workspace = true, features = ["macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
