[invariant]
id = "reconstruct.conversation.history-is-delta-concatenation"
statement = "For a Root or Fork conversation, its stored history without system messages equals its base (empty for Root, the first shared_prefix non-system messages of the parent for Fork), followed, for each of its deltas in threading order, by the request's non-system messages the delta was cut from (its new_inputs together with the messages reconstruct.delta.excludes-seen-elsewhere withheld, in request order) and then output if present."
kind = "domain"
property = "inductive"
requires = ["property"]
rationale = """
Deltas are the only record downstream layers see. If concatenating them does
not rebuild the history, a consumer replaying deltas sees messages the
gateway never scanned or skips ones it did. This also pins down that the
stored history includes each exchange's response, so the next request's
echo of that response is not reported as new input. Compactions are left
out because carried-over messages are excluded from new_inputs wherever
they sit in the request, yet stay in the stored history; their law is
reconstruct.conversation.compaction-history. Messages another conversation
already holds (reconstruct.delta.excludes-seen-elsewhere) are withheld from new_inputs but stored
in place, so the deltas alone rebuild the history only together with them.
"""

[evidence]
property = "crosstalk_reconstruct::tests::thread_props::conversation_history_is_concatenation_of_deltas"

[evidence-review]
property = { agent = "true", human = "false" }
