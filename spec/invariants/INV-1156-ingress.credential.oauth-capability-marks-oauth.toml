[invariant]
id = "ingress.credential.oauth-capability-marks-oauth"
statement = "On an Anthropic upstream (vendor API or subscription), a credential sent as Authorization: Bearer with an anthropic-beta value that starts with oauth- (comma-separated, trimmed, without regard to case) is OAuthAccessToken whatever the token's shape; a credential in a key header is never OAuthAccessToken by this rule, and without such a value the shape rule decides."
kind = "domain"
property = "model-based"
requires = ["unit", "property"]
rationale = """
Claude Code on a Claude Pro/Max login reaches api.anthropic.com, the API's
own host, with a Bearer token, and the gateway docs name the OAuth
capability in anthropic-beta as what marks it (stripping it fails the
request with 401). The token's sk-ant-oat prefix is observed, not
documented: if it changed, OAuth tokens would be read as stable API keys
and L3 would scope harness ids by a digest that changes at every refresh,
splitting one session into an agent per token. The beta value is matched
by prefix, not pinned, because the docs say not to allowlist beta values.
A key header with the beta stays a key: only a bearer token can be the
subscription login.
"""

[evidence]
unit = [
    "crosstalk_ingress::tests::subscription::oauth_capability_marks_oauth",
    "crosstalk_ingress::tests::subscription::oauth_capability_reads_the_header_only",
    "crosstalk_ingress::tests::subscription::subscription_session_passes_through_and_is_captured",
]
property = "crosstalk_ingress::tests::subscription::oauth_capability_marks_oauth_anywhere"

[evidence-review]
unit = { agent = "true", human = "false" }
property = { agent = "true", human = "false" }
