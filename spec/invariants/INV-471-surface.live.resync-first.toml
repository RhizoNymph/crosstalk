[invariant]
id = "surface.live.resync-first"
statement = "When a subscription's resume plan is Resync, the stream's first item is LiveItem::Resync with the plan's reason and the head cursor, and every update it delivers afterwards was appended after that head."
kind = "domain"
property = "postcondition"
requires = ["unit"]
rationale = """
Resync tells the client to refetch through QueryApi and then apply what
follows. If an update from before the head followed the marker, the client
would apply it on top of a fresher snapshot; if the marker were omitted,
the client would not know it had missed anything.
"""

[evidence]
unit = "crosstalk::surface::tests::unresumable_cursor_gets_resync_first"

[evidence-review]
unit = { agent = "false", human = "false" }
