[invariant]
id = "flow.extract.read-requires-result"
statement = "ResourceExtractor::extract returns no Read access when called without a tool result."
kind = "domain"
property = "postcondition"
requires = ["property"]
rationale = """
A read means the resource's content reached the reader. A call with no
result yet may have failed or never returned; recording a read for it would
open transmissions on content the reader never saw. Writes need no result:
the call's arguments are what was written.
"""

[evidence]
property = "crosstalk::flow::extract::tests::no_read_without_result"

[evidence-review]
property = { agent = "false", human = "false" }
