[invariant]
id = "canonical.ids.secret-version-recorded"
statement = "Every secret digest records the SecretVersion that keyed it, so digests under different versions are never equal."
kind = "representation"
requires = ["type", "unit"]
rationale = """
After a rotation the same credential has one digest per loaded version. If
the version were not part of the value, a digest under the new key could
only be told apart from one under the old key by luck, and stored evidence
could not be re-linked across the change. The fields are private and
from_keyed_digest requires a version, so no secret digest exists without
one, and equality includes it.
"""

[evidence]
type = [
  "crosstalk_spec::ids::CredentialHash::from_keyed_digest",
  "crosstalk_spec::ids::AccountHash::from_keyed_digest",
]
unit = "crosstalk_spec::tests::observed::secret_digests_remember_their_key_version"

[evidence-review]
type = { agent = "true", human = "false" }
unit = { agent = "true", human = "false" }
