[invariant]
id = "flow.channel.change-announced"
statement = "After every committed change to a stored channel (discovery, a declaration from config, a new resource, any detection change including turning dormant or unused, a recorded policy decision from config or PolicyChanged) flow publishes Changed::Channel at least once for it, and after a promotion for the promoted channel and every channel it superseded, never before the change is visible to QueryApi::channel and policy_history."
kind = "coordination"
requires = ["dst"]
rationale = """
Several channel changes have no other event (a new resource, turning
dormant, a config declaration or policy), and a PolicyChanged is only a
request until flow records it. Announcing from flow after the commit, not
from the surface that published the request, is what makes a re-query
after the event see the new policy.
"""

[evidence]
dst = "crosstalk::flow::dst::channel_changes_announced_after_commit"

[evidence-review]
dst = { agent = "false", human = "false" }
