[invariant]
id = "flow.coaccess.within-window"
statement = "A CoAccess's lag never exceeds the correlation window it was built with."
kind = "representation"
requires = ["type", "unit"]
rationale = """
Without a bound, any read of a long-lived shared resource pairs with every
earlier write by any agent, and suspected transmissions grow without limit.
The window is the trade-off between recall and false positives.
`CoAccess::new` rejects a longer lag with `InvalidCoAccess::OutsideWindow`.
"""

[evidence]
type = "crosstalk_spec::derived::flow::evidence::CoAccess::new"
unit = "crosstalk_spec::tests::flow::co_access_rejects_invalid_pairs"

[evidence-review]
type = { agent = "true", human = "false" }
unit = { agent = "true", human = "false" }
