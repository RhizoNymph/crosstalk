[invariant]
id = "flow.transmission.crossing-resolved"
statement = "Transmission::crossing is Unknown for a Detected transmission, Crosses for a confirmed, classified or aggregated one whose sender and reader resolve to different agents and for one backed only by co-accesses at least one of whose writers resolves to an agent other than the reader, and WithinOneAgent otherwise."
kind = "domain"
property = "postcondition"
requires = ["unit"]
rationale = """
A transmission is between different agents when recorded, but merges are
aliases resolved at read time, so its two ids can later name one agent.
One definition of "still a transmission" keeps every reader (channel
listings, rows, counts, graphs, search, exports, alerts) agreeing; for a
suspected transmission any writer other than the reader keeps it crossing,
since each co-access is evidence on its own.
"""

[evidence]
unit = [
    "crosstalk_spec::tests::confirmation::a_confirmed_transmission_crosses_until_its_agents_merge",
    "crosstalk_spec::tests::confirmation::a_suspected_transmission_crosses_while_any_writer_is_another_agent",
    "crosstalk_spec::tests::confirmation::a_detected_transmission_names_no_sender",
]

[evidence-review]
unit = { agent = "true", human = "false" }
