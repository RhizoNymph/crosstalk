[invariant]
id = "analysis.projection.stable-within-token"
statement = "Any two projections with equal tokens give every transmission they both contain the same coordinates and the same topic."
kind = "coordination"
requires = ["property"]
rationale = """
The token is how a client knows it may merge points from several responses
into one canvas. Transmissions placed after the layout was fitted are
transformed into it without moving earlier points; anything that moves a
point or reassigns its topic (a re-fit, a new topic version) must issue a
new token.
"""

[evidence]
property = "crosstalk::analysis::tests::prop_points_fixed_within_layout_across_inserts"

[evidence-review]
property = { agent = "false", human = "false" }
