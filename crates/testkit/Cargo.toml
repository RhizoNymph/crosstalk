[package]
name = "crosstalk-testkit"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Test support for crosstalk: builders for common spec values, the recorded-traffic corpus and its loader, and fake upstreams that replay it."

[lints]
workspace = true

[dependencies]
crosstalk-spec = { path = "../../spec" }
bytes.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["client", "http1", "server"] }
hyper-util = { workspace = true, features = ["tokio"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tracing.workspace = true
