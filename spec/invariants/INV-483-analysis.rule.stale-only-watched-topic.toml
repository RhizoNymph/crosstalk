[invariant]
id = "analysis.rule.stale-only-watched-topic"
statement = "Only a WatchedTopic rule can be stale, and staleness is independent of whether the rule is enabled or disabled."
kind = "representation"
requires = ["type", "unit"]
rationale = """
Staleness means a topic id lost its meaning after a re-fit, which only
watched-topic rules have. Keeping it apart from the operator's switch lets
a stale rule be disabled without forgetting that it is stale, so enabling
it again cannot revive superseded topic ids. `TopicWatch::Stale` exists
only inside `AlertRule::WatchedTopic`, and `RuleStatus` has only Enabled
and Disabled.
"""

[evidence]
type = [
    "crosstalk_spec::aggregates::alert::TopicWatch",
    "crosstalk_spec::aggregates::alert::RuleStatus",
]
unit = [
    "crosstalk_spec::tests::aggregates::only_watched_topic_rules_can_be_stale",
    "crosstalk_spec::tests::aggregates::a_rule_evaluates_only_when_enabled_and_current",
]

[evidence-review]
type = { agent = "true", human = "false" }
unit = { agent = "true", human = "false" }
